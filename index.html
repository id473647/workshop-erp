<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor Command - My Care ERP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #2c3e50; --success: #27ae60; --moped: #3498db; --service: #f1c40f; 
            --light: #f4f7f6; --border: #e2e8f0; --text-main: #1e293b;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--light); margin: 0; padding: 0; color: var(--text-main); }
        
        /* Master Layout Constraint: Centered Navigation Box */
        .top-nav { 
            max-width: 950px; 
            margin: 0 auto; 
            background: white; 
            padding: 12px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--border); 
            box-sizing: border-box; 
        }
        .nav-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; color: var(--primary); }
        .nav-brand img { height: 32px; }
        .center-home-btn { font-weight: 700; color: var(--primary); text-decoration: none; padding: 6px 16px; background: #f1f5f9; border-radius: 6px; border: 1px solid var(--border); font-size: 0.85rem; }
        .user-console { display: flex; align-items: center; gap: 12px; }
        .role-pill { background: var(--success); color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .logout-btn { color: #ef4444; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-decoration: none; }

        .wrapper { max-width: 950px; margin: 0 auto; padding: 20px; box-sizing: border-box; }

        /* Metrics Display */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .metric-card { background: white; padding: 16px; border-radius: 8px; border: 1px solid var(--border); border-top: 4px solid var(--primary); }
        .metric-label { font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .metric-value { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-top: 4px; }

        /* Action Nav Matrix */
        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .action-btn { padding: 12px; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 700; color: white; cursor: pointer; text-align: center; text-decoration: none; display: none; }
        .bg-green { background: var(--success); }
        .bg-moped { background: var(--moped); }
        .bg-service { background: var(--primary); }
        .bg-console { background: #475569; }

        /* Execution Pipeline Stack */
        .section-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .section-bar h2 { font-size: 1.1rem; margin: 0; color: var(--primary); }
        .refresh-trigger { border: none; background: none; color: var(--primary); font-size: 0.8rem; font-weight: 700; cursor: pointer; }

        .pipeline-stack { display: flex; flex-direction: column; gap: 12px; }
        .dispatch-card { background: white; padding: 16px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        
        /* Persistent Visual Edge Rules */
        .source-edge-green { border-left: 6px solid var(--success); }
        .source-edge-moped { border-left: 6px solid var(--moped); }
        .source-edge-service { border-left: 6px solid var(--service); }

        .card-primary { font-size: 1.1rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .card-meta { font-size: 0.8rem; color: #64748b; margin-top: 4px; }
        .prepaid-badge { background: #f1f5f9; color: #0f766e; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .card-valuation { font-size: 1.2rem; font-weight: 700; color: var(--success); }
    </style>
</head>
<body>

<nav class="top-nav">
    <div class="nav-brand">
        <img src="logo-main.jpg" onerror="this.style.display='none'">
        <span>MY CARE</span>
    </div>
    <a href="index.html" class="center-home-btn">🏠 HOME</a>
    <div class="user-console">
        <span id="roleIndicator" class="role-pill">GUEST</span>
        <a href="login.html" class="logout-btn" onclick="flushSession()">LOGOUT</a>
    </div>
</nav>

<div class="wrapper">
    <div class="metrics-grid">
        <div class="metric-card"><div class="metric-label">Green Spares Flow</div><div id="mGreen" class="metric-value">₹0</div></div>
        <div class="metric-card"><div class="metric-label">Moped Warehouse Net</div><div id="mMoped" class="metric-value">₹0</div></div>
        <div class="metric-card"><div class="metric-label">Lubricants Allocation</div><div id="mLube" class="metric-value">₹0</div></div>
        <div class="metric-card"><div class="metric-label">Net Staff Payable</div><div id="mStaff" class="metric-value">₹0</div></div>
    </div>

    <div class="controls-grid">
        <a href="new-jobcard.html" id="btnJcGreen" class="action-btn bg-green">+ GREEN JOB CARD</a>
        <a href="pos-green.html" id="btnPosGreen" class="action-btn bg-green">🛒 RETAIL POS</a>
        <a href="ledger.html?scope=credit" id="btnLedgerGreen" class="action-btn bg-green">👥 CREDIT LEDGER</a>

        <a href="new-jobcard.html" id="btnJcMoped" class="action-btn bg-moped">+ MOPED JOB CARD</a>
        <a href="new-jobcard.html" id="btnJcService" class="action-btn bg-service">+ SERVICE DISPATCH</a>
        <a href="admin-console.html" id="btnConsole" class="action-btn bg-console">⚙️ MASTER ADMIN</a>
    </div>

    <div class="section-bar">
        <h2>Active Floor Dispatch List</h2>
        <button class="refresh-trigger" onclick="syncFloorState()">↻ REFRESH DATA</button>
    </div>
    
    <div id="floorStack" class="pipeline-stack">
        <div style="text-align:center; padding:32px; color:#94a3b8; font-size:0.9rem;">Querying instances from central cloud...</div>
    </div>
</div>

<script>
    const SB_URL = "https://jycoirrphpvxkrwrjcwf.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    const sessionRole = localStorage.getItem('ERP_ACTIVE_ROLE') || 'guest';

    function compileRbacRules() {
        if(sessionRole === 'guest') {
            window.location.href = 'login.html';
            return;
        }

        document.getElementById('roleIndicator').innerText = sessionRole;

        const permissions = {
            green: ['btnJcGreen', 'btnPosGreen', 'btnLedgerGreen'],
            moped: ['btnJcMoped'],
            service: ['btnJcService', 'btnConsole'],
            admin: ['btnJcGreen', 'btnPosGreen', 'btnLedgerGreen', 'btnJcMoped', 'btnJcService', 'btnConsole']
        };

        permissions[sessionRole]?.forEach(id => {
            const node = document.getElementById(id);
            if(node) node.style.display = 'block';
        });

        compileDashboardMetrics();
        syncFloorState();
    }

    async function compileDashboardMetrics() {
        const { data: records } = await supabaseClient.from('job_cards').select('green_total, moped_total, lubricant_total').eq('status', 'Closed');
        let gSum = 0, mSum = 0, lSum = 0;
        records?.forEach(r => {
            gSum += parseFloat(r.green_total) || 0;
            mSum += parseFloat(r.moped_total) || 0;
            lSum += parseFloat(r.lubricant_total) || 0;
        });

        document.getElementById('mGreen').innerText = "₹" + gSum;
        document.getElementById('mMoped').innerText = "₹" + mSum;
        document.getElementById('mLube').innerText = "₹" + lSum;
    }

    async function syncFloorState() {
        const { data: instances } = await supabaseClient.from('job_cards')
            .select('id, total_invoice_value, advance_paid, source_role, customer_mobile, vehicles(reg_number, make_model), mechanics(name)')
            .eq('status', 'Open').order('jc_date', { ascending: false });

        const container = document.getElementById('floorStack');
        container.innerHTML = '';

        if(instances && instances.length > 0) {
            instances.forEach(j => {
                const plate = j.vehicles?.reg_number || 'UNREGISTERED';
                const baseModel = j.vehicles?.make_model || 'Direct Line Processing';
                const creator = j.source_role || 'service';
                const prepay = parseFloat(j.advance_paid) || 0;
                const prepayIndicator = prepay > 0 ? `<span class="prepaid-badge">Prepaid Buffer: ₹${prepay}</span>` : '';

                container.innerHTML += `
                    <div class="dispatch-card source-edge-${creator}" onclick="window.location.href='billing.html?id=${j.id}'">
                        <div>
                            <div class="card-primary">${plate} ${prepayIndicator}</div>
                            <div class="card-meta">${baseModel} | Mobile: ${j.customer_mobile}</div>
                            <div class="card-meta" style="color:var(--primary); font-weight:700;">Floor Technician: ${j.mechanics?.name || 'Unassigned'}</div>
                        </div>
                        <div class="card-valuation">₹${Math.round(j.total_invoice_value || 0)}</div>
                    </div>`;
            });
        } else {
            container.innerHTML = '<div style="text-align:center; padding:24px; color:#94a3b8;">Floor view is clear. No unclosed service tasks pending.</div>';
        }
    }

    function flushSession() { localStorage.removeItem('ERP_ACTIVE_ROLE'); }
    compileRbacRules();
</script>
</body>
</html>
