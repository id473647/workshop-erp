<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Care - Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --info: #2980b9; --warning: #f1c40f; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding: 15px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 10px; border-radius: 8px; text-align: center; border-top: 4px solid var(--primary); }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; border-left: 6px solid var(--info); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .reg-no { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        .amount { font-size: 1.2rem; font-weight: bold; color: var(--success); }
        .mech-tag { background: #eee; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-top: 5px; display: inline-block; }
    </style>
</head>
<body>

    <div class="stats-grid">
        <div class="stat-card"><small>Green/Oil</small><div id="netGreen" style="font-weight:bold;">₹0</div></div>
        <div class="stat-card"><small>Moped Net</small><div id="netMoped" style="font-weight:bold;">₹0</div></div>
        <div class="stat-card"><small>Staff Pay</small><div id="netStaff" style="font-weight:bold;">₹0</div></div>
    </div>

    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3>Open Job Cards</h3>
        <a href="new-jobcard.html" style="background:var(--success); color:white; padding:10px 15px; border-radius:8px; text-decoration:none; font-weight:bold;">+ NEW JOB</a>
    </div>

    <div id="activeJobs">Syncing workshop...</div>

<script>
    const SB_URL = "https://jycoirrphpvxkrwrjcwf.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    async function loadDashboard() {
        // Fetch Open Jobs + Mechanic Names
        const { data: jobs } = await supabaseClient.from('job_cards')
            .select('id, total_invoice_value, vehicles(reg_number, make_model), mechanics(name)')
            .eq('status', 'Open');
        
        let html = '';
        jobs?.forEach(j => {
            html += `
                <div class="card" onclick="window.location.href='billing.html?id=${j.id}'">
                    <div class="card-header">
                        <div>
                            <span class="reg-no">${j.vehicles.reg_number}</span><br>
                            <small>${j.vehicles.make_model}</small><br>
                            <span class="mech-tag">Technician: ${j.mechanics?.name || 'Unassigned'}</span>
                        </div>
                        <div class="amount">₹${j.total_invoice_value || 0}</div>
                    </div>
                </div>`;
        });
        document.getElementById('activeJobs').innerHTML = html || 'No bikes on floor.';
    }
    loadDashboard();
</script>
</body>
</html>
