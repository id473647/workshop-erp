<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Access Gateway - My Care ERP</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .router-box { background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; max-width: 400px; width: 100%; box-sizing: border-box; }
        .loader { width: 40px; height: 40px; border: 4px solid #f1f5f9; border-top-color: #2980b9; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="router-box">
    <div class="loader"></div>
    <h3 style="margin:0 0 8px 0; color:#1e293b;">Evaluating Access Context...</h3>
    <div style="font-size:0.85rem; color:#64748b;">Routing secure session state parameters directly to mapped target destination files.</div>
</div>

<script>
    setTimeout(() => {
        const role = localStorage.getItem('ERP_ACTIVE_ROLE') || 'guest';
        
        // Evaluates target permission conditions defined across Section 2(v)
        if(role === 'admin') {
            // Unlocks master administrative tools, brand tables, password matrices, and historical archiver endpoints
            window.location.href = 'admin-console.html';
        } else if(role === 'service') {
            // Unlocks localized staff commissions alongside workshop reporting maps
            window.location.href = 'reports.html';
        } else if(role === 'green' || role === 'moped') {
            // Directs line staff securely to base analytics reports tabs
            window.location.href = 'reports.html';
        } else {
            alert("Session validation checks failed tracking credentials authorization paths.");
            window.location.href = 'login.html';
        }
    }, 600);
</script>
</body>
</html>
