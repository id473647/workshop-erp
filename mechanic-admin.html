<style>
:root{--primary:#2c3e50;--success:#27ae60;--info:#2980b9;--light:#f8fafc;--border:#e2e8f0;--text:#1e293b;--danger:#e74c3c;--warning:#f59e0b;--purple:#8e44ad;}
*{box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--light);margin:0;padding:0;color:var(--text);padding-bottom:60px;}
.sticky-nav{max-width:950px;margin:0 auto;background:white;padding:12px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.02);position:sticky;top:0;z-index:100;}
.logo-matrix{display:flex;align-items:center;gap:8px;}.logo-matrix img{height:32px;object-fit:contain;}
.nav-actions{display:flex;align-items:center;gap:8px;}
.btn-header{padding:5px 12px;border-radius:6px;border:1px solid var(--border);font-size:.8rem;font-weight:700;text-decoration:none;cursor:pointer;background:#f1f5f9;color:var(--primary);}
.btn-logout{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;}
.badge-role{background:#0f172a;color:white;padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:700;text-transform:uppercase;margin-left:8px;}
.wrapper{max-width:950px;margin:0 auto;padding:20px;}
.card-panel{background:white;padding:20px;border-radius:10px;border:1px solid var(--border);margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.02);}
.block-title{font-size:1.05rem;font-weight:700;color:var(--primary);border-bottom:2px solid var(--border);padding-bottom:8px;margin-bottom:16px;}
.inputs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px;align-items:end;}
.field-group{display:flex;flex-direction:column;gap:4px;}
.field-group label{font-size:.7rem;font-weight:700;color:#64748b;text-transform:uppercase;}
input,select{padding:10px;border:1px solid var(--border);border-radius:6px;font-size:.88rem;}
input:read-only{background:#f8fafc;color:#64748b;}
.btn-action{background:var(--success);color:white;border:none;padding:10px 18px;border-radius:6px;font-weight:700;cursor:pointer;font-size:.85rem;transition:opacity .15s;}
.btn-action:hover{opacity:.9;}
.btn-info{background:var(--info);}.btn-warn{background:var(--warning);color:#000;}.btn-danger{background:var(--danger);}.btn-purple{background:var(--purple);}
.table-wrapper{border-radius:8px;border:1px solid var(--border);overflow-x:auto;margin-top:12px;}
table{width:100%;border-collapse:collapse;font-size:.83rem;}
th{background:#f8fafc;padding:9px 12px;font-size:.7rem;font-weight:700;color:#64748b;text-transform:uppercase;border-bottom:1px solid var(--border);text-align:left;}
td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
/* Attendance badge */
.att-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.68rem;font-weight:700;}
/* Profile panel */
.profile-panel{background:#f8fafc;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;}
.profile-panel-inner{padding:20px;}
.prof-section{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.prof-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.prof-section-title{font-size:.75rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:10px;}
.profile-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--border);}
.profile-photo-placeholder{width:80px;height:80px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:1.8rem;border:2px solid var(--border);}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:.83rem;}
.detail-label{color:#64748b;font-weight:700;}
.detail-val{color:var(--text);}
.propose-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.propose-row input{flex:1;min-width:100px;padding:7px;font-size:.82rem;}
.propose-row textarea{flex:2;min-width:150px;padding:7px;font-size:.82rem;border:1px solid var(--border);border-radius:6px;resize:none;}
.status-badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:.7rem;font-weight:700;}
.badge-active{background:#dcfce7;color:#166534;}.badge-locked{background:#fee2e2;color:#991b1b;}.badge-inactive{background:#e2e8f0;color:#475569;}
@media print{
  .no-print{display:none!important;}
  .print-only{display:block!important;}
  body{background:white;}
  .sticky-nav,.btn-action,.btn-header{display:none!important;}
}
</style>
</head>

// ── PIN HASHING ──────────────────────────────────────────────────────────────
async function hashPIN(pin){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ── STAFF SAVE / EDIT ────────────────────────────────────────────────────────
let activeEditId=null;
function cancelEdit(){
  activeEditId=null;
  document.getElementById('tName').value='';
  document.getElementById('tMobile').value='';
  document.getElementById('tRole').value='Mechanic';
  document.getElementById('tComm').value='0';
  document.getElementById('btnSaveStaff').innerText='SAVE STAFF PROFILE';
  document.getElementById('btnCancelEdit').style.display='none';
}
function editStaffForm(id,name,mobile,role,comm){
  activeEditId=id;
  document.getElementById('tName').value=name;
  document.getElementById('tMobile').value=mobile||'';
  document.getElementById('tRole').value=role||'Mechanic';
  document.getElementById('tComm').value=comm||0;
  document.getElementById('btnSaveStaff').innerText='UPDATE STAFF PROFILE';
  document.getElementById('btnCancelEdit').style.display='inline-block';
  window.scrollTo({top:0,behavior:'smooth'});
}
async function saveStaff(){
  const name=document.getElementById('tName').value.trim().toUpperCase();
  const mobile=document.getElementById('tMobile').value.trim();
  const role=document.getElementById('tRole').value;
  const comm=parseFloat(document.getElementById('tComm').value)||0;
  if(!name||mobile.length!==10) return alert('Valid name and 10-digit mobile required.');
  const payload={name,mobile_number:Number(mobile),staff_role:role,commission_rate:comm,is_active:true};
  if(activeEditId){
    const{error}=await sb.from('mechanics').update(payload).eq('id',activeEditId);
    if(error) return alert('Error: '+error.message);
  } else {
    const{error}=await sb.from('mechanics').insert(payload);
    if(error) return alert('Error: '+error.message);
  }
  cancelEdit();
  loadStaff();
}
async function deactivateStaff(id,name){
  if(!confirm(`Remove ${name} from active roster?`)) return;
  const{error}=await sb.from('mechanics').update({is_active:false}).eq('id',id);
  if(!error) loadStaff();
}

// ── STAFF LOAD ───────────────────────────────────────────────────────────────
async function loadStaff(){
  const today=new Date().toISOString().split('T')[0];
  const[staffRes,attRes]=await Promise.all([
    sb.from('mechanics').select('*').eq('is_active',true).order('staff_role').order('name'),
    sb.from('mechanic_attendance').select('mech_id,status,approved_status,check_in_time').eq('date',today)
  ]);
  const list=staffRes.data||[];
  const attMap={};
  (attRes.data||[]).forEach(a=>attMap[a.mech_id]=a);
  const tbody=document.getElementById('staffBody'); tbody.innerHTML='';
  list.forEach(m=>{
    const att=attMap[m.id];
    let attBadge='<span style="font-size:.68rem;color:#94a3b8;">Not marked</span>';
    if(att){
      const final=att.approved_status||att.status||'Marked';
      const pending=!att.approved_status;
      let bg='#e2e8f0',col='#475569';
      if(final==='Present'||final==='On Time'){bg='#dcfce7';col='#166534';}
      else if(final==='Late'){bg='#fef9c3';col='#854d0e';}
      else if(final==='Half Day'){bg='#fff7ed';col='#9a3412';}
      else if(final==='Absent'){bg='#fee2e2';col='#991b1b';}
      attBadge=`<span class="att-badge" style="background:${bg};color:${col};">${final}${pending?' ⏳':''}</span>`;
    }
    const pts=parseFloat(m.earned_points)||0;
    const statusBadge=m.lockout_active?'<span class="status-badge badge-locked">LOCKED</span>':'<span class="status-badge badge-active">ACTIVE</span>';
    const cashBtn=pts>0&&(sessionRole==='admin'||sessionRole==='service')?`<button class="btn-action btn-warn" style="padding:4px 8px;font-size:.75rem;" onclick="cashOutPoints('${m.id}','${m.name.replace(/'/g,"\\'")}',${pts})">Pay ₹${Math.floor(pts)}</button>`:'';
    const liftBtn=m.lockout_active&&sessionRole==='admin'?`<button class="btn-action btn-info" style="padding:4px 8px;font-size:.75rem;" onclick="liftLockout('${m.id}')">Lift Lock</button>`:'';
    tbody.innerHTML+=`
      <tr id="row_${m.id}">
        <td>
          <strong>${m.name}</strong> ${statusBadge}
          <br><small style="color:#64748b;">${m.mobile_number||''} · ${m.commission_rate||0}% comm.</small>
        </td>
        <td><span style="background:#e2e8f0;color:#475569;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:700;">${m.staff_role}</span></td>
        <td>${attBadge}</td>
        <td>${Math.floor(pts)} Pts</td>
        <td>
          <div style="display:flex;gap:5px;flex-wrap:wrap;">
            <button class="btn-action btn-info" style="padding:4px 8px;font-size:.75rem;" onclick="toggleProfile('${m.id}')">👤 PROFILE</button>
            <button class="btn-action" style="padding:4px 8px;font-size:.75rem;background:#e2e8f0;color:#1e293b;" onclick="editStaffForm('${m.id}','${m.name.replace(/'/g,"\\'")}','${m.mobile_number}','${m.staff_role}',${m.commission_rate||0})">✏️ EDIT</button>
            ${cashBtn}${liftBtn}
            <button class="btn-action btn-danger" style="padding:4px 8px;font-size:.75rem;" onclick="deactivateStaff('${m.id}','${m.name.replace(/'/g,"\\'")}')">DROP</button>
          </div>
        </td>
      </tr>
      <tr id="profilePanel_${m.id}" style="display:none;">
        <td colspan="5" class="profile-panel">
          <div class="profile-panel-inner" id="profileContent_${m.id}">
            <div style="text-align:center;padding:20px;color:#94a3b8;">Loading profile...</div>
          </div>
        </td>
      </tr>`;
  });
}

// ── PROFILE PANEL ────────────────────────────────────────────────────────────
let openProfileId=null;
async function toggleProfile(mechId){
  const panel=document.getElementById(`profilePanel_${mechId}`);
  if(openProfileId&&openProfileId!==mechId){
    const prev=document.getElementById(`profilePanel_${openProfileId}`);
    if(prev) prev.style.display='none';
  }
  if(panel.style.display==='none'||panel.style.display===''){
    panel.style.display='table-row';
    openProfileId=mechId;
    await renderProfilePanel(mechId);
  } else {
    panel.style.display='none';
    openProfileId=null;
  }
}

  let idProofHtml='<span style="color:#94a3b8;font-size:.82rem;">No ID photo uploaded</span>';

  if(m.profile_photo_url){
    const{data:u}=await sb.storage.from('staff-documents').createSignedUrl(m.profile_photo_url,3600);
    if(u?.signedUrl) profilePhotoHtml=`<img src="${u.signedUrl}" class="profile-photo" alt="${m.name}">`;
  }
  if(m.id_proof_photo_url){
    const{data:u}=await sb.storage.from('staff-documents').createSignedUrl(m.id_proof_photo_url,3600);

      idProofHtml=`<button class="btn-action btn-info" style="padding:4px 12px;font-size:.75rem;" onclick="window.open('${u.signedUrl}','_blank')">🪪 VIEW ID PHOTO</button>`;

    }
  }

  const isAdmin=sessionRole==='admin';
  const canManage=isAdmin||sessionRole==='service';

  content.innerHTML=`
    <!-- HEADER -->
    <div class="prof-section" style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;">
      <div style="flex:0 0 auto;">
        ${profilePhotoHtml}
        ${canManage?`<label style="display:block;text-align:center;margin-top:6px;cursor:pointer;font-size:.72rem;color:var(--info);font-weight:700;">
          📷 Upload Photo
          <input type="file" accept="image/*" style="display:none;" onchange="uploadStaffPhoto('${mechId}',this)">
        </label>`:''}
      </div>
      <div style="flex:1;">
        <div style="font-size:1.1rem;font-weight:700;color:var(--primary);">${m.name}</div>
        <div style="font-size:.85rem;color:#64748b;">${m.staff_role} · ${m.mobile_number}</div>
        <div style="font-size:.85rem;margin-top:4px;">Commission: <strong>${m.commission_rate||0}%</strong></div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-action no-print" style="padding:6px 14px;font-size:.78rem;background:#e2e8f0;color:#1e293b;" onclick="printStaffProfile('${mechId}')">🖨️ PRINT PROFILE</button>
        </div>
      </div>
    </div>

    <!-- PERSONAL DETAILS (filled by mechanic) -->
    <div class="prof-section">
      <div class="prof-section-title">Personal Details (filled by mechanic)</div>
      <div class="detail-row"><span class="detail-label">Address</span><span class="detail-val">${m.address||'—'}</span></div>
      <div class="detail-row"><span class="detail-label">Emergency Contact</span><span class="detail-val">${m.emergency_contact_name||'—'} (${m.emergency_contact_relation||'—'})</span></div>
      <div class="detail-row"><span class="detail-label">Emergency Mobile</span><span class="detail-val">${m.emergency_contact_mobile||'—'}</span></div>
      <div class="detail-row"><span class="detail-label">ID Type</span><span class="detail-val">${m.id_proof_type||'—'}</span></div>
      <div class="detail-row"><span class="detail-label">ID Number</span><span class="detail-val">${m.id_proof_number||'—'}</span></div>
      <div style="margin-top:8px;">${idProofHtml}</div>
    </div>

    <!-- FINANCIAL TERMS -->
    ${canManage?`
    <div class="prof-section">
      <div class="prof-section-title">Financial Terms (requires Admin approval)</div>
      <div style="margin-bottom:10px;">
        <div class="detail-row"><span class="detail-label">Commission Rate</span><span class="detail-val">${m.commission_rate||0}%</span></div>
        <div class="propose-row">
          <input type="number" id="propComm_${mechId}" placeholder="New %" min="0" max="100" style="width:80px;">
          <textarea id="propCommReason_${mechId}" placeholder="Reason for change (required)" rows="1"></textarea>
          <button class="btn-action btn-warn" onclick="proposeChange('${mechId}','${m.name.replace(/'/g,"\\'")}','commission_rate','${m.commission_rate||0}%','propComm_${mechId}','propCommReason_${mechId}','%')">PROPOSE</button>
        </div>
      </div>
      <div style="margin-bottom:10px;">
        <div class="detail-row"><span class="detail-label">Opening Balance</span><span class="detail-val">₹${m.opening_balance||0} (as of ${m.opening_balance_date||'not set'})</span></div>

          <input type="number" id="propBal_${mechId}" placeholder="Amount ₹">

        </div>
      </div>
    </div>`:''}

    <!-- PIN MANAGEMENT -->
    ${canManage?`
    <div class="prof-section">
      <div class="prof-section-title">PIN Management</div>
      <div class="detail-row">
        <span class="detail-label">PIN Status</span>
        <span class="detail-val">${m.pin_set?'✅ PIN Set':'⚠️ PIN Not Set (will be prompted on first login)'}</span>
      </div>
      <div class="propose-row" style="margin-top:10px;">
        <input type="number" id="tempPin_${mechId}" placeholder="4-digit temp PIN" maxlength="4" style="width:130px;">
        <button class="btn-action btn-purple" onclick="resetPIN('${mechId}','${m.name.replace(/'/g,"\\'")}')">RESET PIN</button>
        ${m.webauthn_credential_id?`<button class="btn-action btn-danger" style="font-size:.78rem;" onclick="clearBiometric('${mechId}','${m.name.replace(/'/g,"\\'")}')">REMOVE BIOMETRIC</button>`:'<span style="font-size:.75rem;color:#94a3b8;">No biometric registered</span>'}
      </div>

// ── PROPOSALS ─────────────────────────────────────────────────────────────────
async function proposeChange(mechId,mechName,type,currentVal,inputId,reasonId,suffix=''){
  const el=document.getElementById(inputId);
  const reasonEl=document.getElementById(reasonId);
  const val=(el?.value||'').trim();
  const reason=(reasonEl?.value||'').trim();
  if(!val){alert('Enter a value to propose.');return;}
  if(!reason){alert('Reason is required for this proposal.');return;}
  const{error}=await sb.from('approval_requests').insert({
    request_type:type,entity_id:mechId,entity_type:'mechanic',entity_label:mechName,
    requested_by:sessionRole,current_value:String(currentVal),
    proposed_value:val+suffix,reason,status:'pending'
  });
  if(error){alert('Error: '+error.message);return;}
  if(el) el.value='';
  if(reasonEl) reasonEl.value='';
  alert(`Proposal submitted. ${mechName}'s ${type.replace('_',' ')} change from ${currentVal} to ${val+suffix} is pending Admin approval.`);
}

async function proposeOpeningBalance(mechId,mechName){
  const amt=document.getElementById(`propBal_${mechId}`).value.trim();
  const date=document.getElementById(`propBalDate_${mechId}`).value;
  const reason=document.getElementById(`propBalReason_${mechId}`).value.trim();
  if(!amt||!date){alert('Enter both amount and effective date.');return;}
  if(!reason){alert('Reason is required.');return;}
  const{error}=await sb.from('approval_requests').insert({
    request_type:'opening_balance',entity_id:mechId,entity_type:'mechanic',entity_label:mechName,
    requested_by:sessionRole,current_value:'0',
    proposed_value:`₹${amt} from ${date}`,reason,status:'pending'
  });
  if(error){alert('Error: '+error.message);return;}
  document.getElementById(`propBal_${mechId}`).value='';
  document.getElementById(`propBalDate_${mechId}`).value='';
  document.getElementById(`propBalReason_${mechId}`).value='';
  alert(`Opening balance proposal submitted. Pending Admin approval.`);
}

// ── PIN RESET ─────────────────────────────────────────────────────────────────
async function resetPIN(mechId,mechName){
  const inp=document.getElementById(`tempPin_${mechId}`);
  const tempPin=(inp?.value||'').trim();
  if(tempPin.length!==4||isNaN(tempPin)){alert('Enter a valid 4-digit PIN.');return;}
  const hashed=await hashPIN(tempPin);
  const{error}=await sb.from('mechanics').update({pin_hash:hashed,pin_set:false}).eq('id',mechId);
  if(error){alert('Error: '+error.message);return;}
  if(inp) inp.value='';
  alert(`Temporary PIN set for ${mechName}.\nTell them to login with PIN: ${tempPin}\nThey will be asked to set a new PIN on login.`);
}

async function clearBiometric(mechId,mechName){
  if(!confirm(`Remove biometric for ${mechName}? They will use PIN only.`)) return;
  const{error}=await sb.from('mechanics').update({webauthn_credential_id:null}).eq('id',mechId);
  if(!error){alert('Biometric removed.');renderProfilePanel(mechId);}
}

// ── CASH OUT POINTS ───────────────────────────────────────────────────────────
async function cashOutPoints(mechId,mechName,pts){
  if(!confirm(`Convert ${Math.floor(pts)} points to cash payout for ${mechName}?`)) return;
  const[{error:e1},{error:e2}]=await Promise.all([
    sb.from('mechanics').update({earned_points:0}).eq('id',mechId),
    sb.from('workshop_expenses').insert({expense_category:'Points Cashout',stakeholder_id:mechId,amount:Math.floor(pts),note:`Points Cashout — ${mechName}`,recorded_by:sessionRole})
  ]);
  if(e1||e2){alert('Error during cashout: '+(e1?.message||e2?.message));return;}
  loadStaff();
}

async function liftLockout(mechId){
  if(!confirm('Lift lockout for this mechanic?')) return;
  const{error}=await sb.from('mechanics').update({lockout_active:false}).eq('id',mechId);
  if(!error) loadStaff();
}

// ── PHOTO UPLOAD (by service/admin on behalf of mechanic) ────────────────────
async function uploadStaffPhoto(mechId,input){
  const file=input.files[0]; if(!file) return;
  const path=`profile-photos/${mechId}.jpg`;
  const{error}=await sb.storage.from('staff-documents').upload(path,file,{upsert:true,contentType:file.type});
  if(error){alert('Upload error: '+error.message);return;}
  await sb.from('mechanics').update({profile_photo_url:path}).eq('id',mechId);
  alert('Profile photo updated.');
  renderProfilePanel(mechId);
}

// ── PRINT STAFF PROFILE ───────────────────────────────────────────────────────
async function printStaffProfile(mechId){
  const{data:m}=await sb.from('mechanics').select('*').eq('id',mechId).single();
  if(!m) return;
  let photoHtml='';
  if(m.profile_photo_url){
    const{data:u}=await sb.storage.from('staff-documents').createSignedUrl(m.profile_photo_url,600);
    if(u?.signedUrl) photoHtml=`<img src="${u.signedUrl}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid #ccc;float:right;">`;
  }
  const win=window.open('','_blank','width=600,height=700');
  win.document.write(`<html><head><title>Staff Profile — ${m.name}</title>
  <style>body{font-family:'Segoe UI',Arial,sans-serif;padding:24px;font-size:12px;color:#000;}
  h2{margin:0 0 4px;font-size:16px;}
  .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee;}
  .lbl{font-weight:700;color:#64748b;}
  .sig{display:flex;justify-content:space-between;margin-top:40px;font-size:11px;}
  </style></head><body>
  <div style="border-bottom:2px solid #000;padding-bottom:12px;margin-bottom:16px;overflow:hidden;">
    ${photoHtml}
    <h2>${m.name}</h2>
    <div style="font-size:11px;color:#64748b;">${m.staff_role} · My Care Service Center</div>
  </div>
  <div class="row"><span class="lbl">Mobile</span><span>${m.mobile_number}</span></div>
  <div class="row"><span class="lbl">Commission Rate</span><span>${m.commission_rate||0}%</span></div>
  <div class="row"><span class="lbl">Status</span><span>${m.is_active?'Active':'Inactive'}${m.lockout_active?' | LOCKED OUT':''}</span></div>
  <div class="row"><span class="lbl">Address</span><span>${m.address||'—'}</span></div>
  <div class="row"><span class="lbl">Emergency Contact</span><span>${m.emergency_contact_name||'—'} (${m.emergency_contact_relation||'—'})</span></div>
  <div class="row"><span class="lbl">Emergency Mobile</span><span>${m.emergency_contact_mobile||'—'}</span></div>
  <div class="row"><span class="lbl">ID Type</span><span>${m.id_proof_type||'—'}</span></div>
  <div class="row"><span class="lbl">ID Number</span><span>${m.id_proof_number||'—'}</span></div>
  <div class="row"><span class="lbl">Opening Balance</span><span>₹${m.opening_balance||0} (from ${m.opening_balance_date||'not set'})</span></div>
  <div class="sig">
    <span>Printed by: ${(localStorage.getItem('ERP_ACTIVE_ROLE')||'').toUpperCase()} · ${new Date().toLocaleString('en-IN')}</span>
  </div>
  <div class="sig"><span>________________<br>Manager Signature</span><span>________________<br>Admin Verify</span></div>
  </body></html>`);
  win.document.close();win.focus();setTimeout(()=>win.print(),400);
}

async function printIdProof(mechId,name,idType,idNumber,signedUrl){
  const win=window.open('','_blank','width=600,height=700');
  win.document.write(`<html><head><title>ID Proof — ${name}</title>
  <style>body{font-family:'Segoe UI',Arial,sans-serif;padding:24px;font-size:13px;color:#000;text-align:center;}
  .warn{background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:6px;font-size:11px;color:#9a3412;margin-bottom:16px;}
  img{max-width:100%;border:1px solid #ccc;border-radius:8px;margin-top:16px;}
  </style></head><body>
  <h3 style="margin-bottom:4px;">GOVERNMENT ID PROOF — CONFIDENTIAL</h3>
  <div class="warn">⚠️ This document is confidential. Authorised access only.</div>
  <div><strong>Employee Name:</strong> ${name}</div>
  <div style="margin:8px 0;"><strong>ID Type:</strong> ${idType||'—'}</div>
  <div><strong>ID Number:</strong> <span style="font-size:16px;font-weight:700;font-family:monospace;">${idNumber||'—'}</span></div>
  <img src="${signedUrl}" alt="ID Proof">
  <div style="margin-top:20px;font-size:11px;color:#64748b;">Printed by Admin · ${new Date().toLocaleString('en-IN')}</div>
  </body></html>`);
  win.document.close();win.focus();setTimeout(()=>win.print(),400);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
if(!['admin','service'].includes(sessionRole)){
  document.body.innerHTML='<div style="text-align:center;padding:60px;color:#e74c3c;font-weight:700;font-size:1.2rem;">Access Denied. Admin or Service login required.</div>';
} else {
  loadStaff();
}
</script>
