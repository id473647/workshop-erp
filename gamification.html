<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamification Engine — My Care ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="notifications.js"></script>
<style>
:root{--primary:#2c3e50;--success:#27ae60;--info:#2980b9;--light:#f8fafc;--border:#e2e8f0;--text:#1e293b;--danger:#e74c3c;--gold:#f59e0b;}
*{box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--light);margin:0;padding:0;color:var(--text);padding-bottom:60px;}
.sticky-nav{max-width:950px;margin:0 auto;background:white;padding:12px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.02);position:sticky;top:0;z-index:100;}
.logo-matrix{display:flex;align-items:center;gap:8px;}.logo-matrix img{height:32px;object-fit:contain;}
.nav-actions{display:flex;align-items:center;gap:8px;}
.btn-header{padding:5px 12px;border-radius:6px;border:1px solid var(--border);font-size:.8rem;font-weight:700;text-decoration:none;cursor:pointer;background:#f1f5f9;color:var(--primary);}
.btn-logout{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;}
.badge-role{background:#0f172a;color:white;padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:700;text-transform:uppercase;margin-left:8px;}
.wrapper{max-width:950px;margin:0 auto;padding:20px;}
.card-panel{background:white;padding:20px;border-radius:10px;border:1px solid var(--border);margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.02);}
.block-title{font-size:1.05rem;font-weight:700;color:var(--primary);border-bottom:2px solid var(--border);padding-bottom:8px;margin-bottom:16px;}
.inputs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px;align-items:end;}
.field-group{display:flex;flex-direction:column;gap:4px;}
.field-group label{font-size:.7rem;font-weight:700;color:#64748b;text-transform:uppercase;}
input,select{padding:10px;border:1px solid var(--border);border-radius:6px;font-size:.88rem;}
.btn-action{background:var(--success);color:white;border:none;padding:10px 18px;border-radius:6px;font-weight:700;cursor:pointer;font-size:.85rem;}
.table-wrapper{border-radius:8px;border:1px solid var(--border);overflow-x:auto;margin-top:12px;}
table{width:100%;border-collapse:collapse;font-size:.83rem;}
th{background:#f8fafc;padding:9px 12px;font-size:.7rem;font-weight:700;color:#64748b;text-transform:uppercase;border-bottom:1px solid var(--border);text-align:left;}
td{padding:9px 12px;border-bottom:1px solid #f1f5f9;}
</style>
</head>
<body>
<nav class="sticky-nav">
  <div class="logo-matrix">
    <img src="logo-main.jpg" onerror="this.style.display='none'">
    <img src="logo-green.png" onerror="this.style.display='none'">
  </div>
  <div class="nav-actions">
    <button class="btn-header" onclick="history.back()">← BACK</button>
    <a href="utility-router.html" class="btn-header">🗂️ HUB</a>
    <a href="index.html" class="btn-header">🏠 HOME</a>
    <button class="btn-header btn-logout" onclick="doLogout()">LOGOUT</button>
    <span id="roleDisplay" class="badge-role">STAFF</span>
  </div>
</nav>
<div class="wrapper">
  <div class="card-panel">
    <div class="block-title">🏆 Gamification & Scheme Engine</div>
    <div style="background:#fffbeb;border:1px solid #fde68a;padding:16px;border-radius:8px;margin-bottom:20px;">
      <h4 style="margin:0 0 12px;color:#b45309;">Launch New Target Scheme</h4>
      <div class="inputs-grid">
        <div class="field-group"><label>Scheme Name</label><input type="text" id="schName" placeholder="e.g. SUMMER LUBE PUSH" oninput="this.value=this.value.toUpperCase()"></div>
        <div class="field-group"><label>Target Audience</label><select id="schRole"><option value="Mechanic">Mechanics</option><option value="Workshop Manager">Workshop Managers</option></select></div>
        <div class="field-group"><label>Target Metric</label>
          <select id="schMetric">
            <option value="GREEN_SPARES_VOL">Green Spares Billed (₹)</option>
            <option value="GREEN_LUBE_VOL">Green Lube Billed (ML)</option>
            <option value="JOB_CARD_COUNT">Job Cards Closed (Count)</option>
            <option value="ENGINE_RESTORE_COUNT">Engine Restorations (Count)</option>
          </select>
        </div>
        <div class="field-group"><label>Target Value</label><input type="number" id="schTarget" placeholder="e.g. 35000"></div>
        <div class="field-group"><label>Reward (₹)</label><input type="number" id="schReward" placeholder="e.g. 500"></div>
      </div>
      <button class="btn-action" style="background:var(--gold);" onclick="createScheme()">ACTIVATE SCHEME</button>
    </div>
    <div class="table-wrapper">
      <table><thead><tr><th>Scheme Name</th><th>Audience & Metric</th><th>Target → Reward</th><th>Status</th></tr></thead>
      <tbody id="schemesBody"></tbody></table>
    </div>
  </div>
</div>
<script>
const SB_URL='https://jycoirrphpvxkrwrjcwf.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k';
const sb=supabase.createClient(SB_URL,SB_KEY);
document.getElementById('roleDisplay').innerText=(localStorage.getItem('ERP_ACTIVE_ROLE')||'guest').toUpperCase();
function doLogout(){localStorage.removeItem('ERP_ACTIVE_ROLE');window.location.href='login.html';}
async function loadSchemes(){const{data}=await sb.from('active_schemes').select('*').order('created_at',{ascending:false});const tbody=document.getElementById('schemesBody');tbody.innerHTML='';(data||[]).forEach(s=>{const statusHtml=s.is_active?`<span style="color:var(--success);font-weight:700;">ACTIVE</span> <button onclick="toggleScheme('${s.id}',false)" style="margin-left:8px;font-size:.7rem;cursor:pointer;">Pause</button>`:`<span style="color:var(--danger);font-weight:700;">PAUSED</span> <button onclick="toggleScheme('${s.id}',true)" style="margin-left:8px;font-size:.7rem;cursor:pointer;">Activate</button>`;tbody.innerHTML+=`<tr><td><strong>${s.scheme_name}</strong></td><td><span style="font-size:.75rem;color:#64748b;">${s.target_role}</span><br><strong>${s.metric_type}</strong></td><td>Hit <strong>${s.target_value}</strong><br>Get <strong style="color:var(--gold);">₹${s.reward_amount}</strong></td><td>${statusHtml}</td></tr>`;});}
async function createScheme(){const n=document.getElementById('schName').value.trim().toUpperCase();const r=document.getElementById('schRole').value;const m=document.getElementById('schMetric').value;const t=parseFloat(document.getElementById('schTarget').value);const rw=parseFloat(document.getElementById('schReward').value);if(!n||!t||!rw)return alert('Fill all scheme parameters.');const{error}=await sb.from('active_schemes').insert({scheme_name:n,target_role:r,metric_type:m,target_value:t,reward_amount:rw});if(error)alert('Error: '+error.message);else{alert('Scheme activated!');loadSchemes();}}
async function toggleScheme(id,makeActive){const{error}=await sb.from('active_schemes').update({is_active:makeActive}).eq('id',id);if(error)alert('Error: '+error.message);else loadSchemes();}
loadSchemes();
</script>
</body>
</html>
