<!DOCTYPE html>
<html>
<head>
    <title>Digital Job Card - My Care</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --green: #27ae60; --moped: #e67e22; --primary: #2c3e50; }
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; padding-bottom: 100px; }
        .navbar { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .sticky-header { background: white; padding: 15px; border-bottom: 2px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .item-list { background: white; margin: 10px; border-radius: 10px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; font-size: 0.75rem; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        .action-bar { position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); display: flex; justify-content: space-between; }
        .btn-add { border: none; padding: 10px; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;">← HOME</a>
        <div id="roleDisplay" style="font-size: 0.7rem;">ROLE: GUEST</div>
    </div>

    <div class="sticky-header">
        <div id="vehInfo" style="font-size: 1.2rem; font-weight: bold;">Loading...</div>
        <div id="mechInfo" style="color: #666; font-size: 0.9rem;">Technician: --</div>
    </div>

    <div class="item-list">
        <table>
            <thead>
                <tr><th>Category</th><th>Item & Brand</th><th>Qty</th><th>Total</th><th></th></tr>
            </thead>
            <tbody id="itemsBody"></tbody>
        </table>
    </div>

    <div style="padding: 15px;">
        <button onclick="changeRole()">🔑 Switch Access</button>
    </div>

    <div class="action-bar">
        <div id="controlsSpare" class="hidden">
            <button class="btn-add" style="background:var(--green);" onclick="openAddModal('Green')">+ Green/Lube</button>
            <button class="btn-add" style="background:var(--moped);" onclick="openAddModal('Moped')">+ Moped Part</button>
        </div>
        <div id="controlsWorkshop" class="hidden">
            <div style="font-weight:bold;">Final Collection: ₹<span id="grandTotal">0</span></div>
        </div>
    </div>

    <datalist id="productList"></datalist>
    <datalist id="brandList"></datalist>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get('id');
    const SB_URL = "https://jycoirrphpvxkrwrjcwf.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    let currentRole = 'guest';

    // Point 1: Authorization
    function changeRole() {
        const pin = prompt("Enter PIN:");
        if (pin === "1111") setRole('green'); // Green Spare Mgr
        else if (pin === "2222") setRole('moped'); // Moped Spare Mgr
        else if (pin === "3333") setRole('workshop'); // Workshop Mgr
        else if (pin === "0000") setRole('admin'); // Admin
        else alert("Invalid PIN");
    }

    function setRole(role) {
        currentRole = role;
        document.getElementById('roleDisplay').innerText = "ROLE: " + role.toUpperCase();
        document.getElementById('controlsSpare').classList.toggle('hidden', role !== 'green' && role !== 'moped' && role !== 'admin');
        document.getElementById('controlsWorkshop').classList.toggle('hidden', role !== 'workshop' && role !== 'admin');
    }

    async function loadJob() {
        const { data } = await supabaseClient.from('job_cards').select('*, vehicles(*), mechanics(name)').eq('id', jobId).single();
        if (data) {
            document.getElementById('vehInfo').innerText = data.vehicles.reg_number + " (" + data.vehicles.make_model + ")";
            document.getElementById('mechInfo').innerText = "Technician: " + (data.mechanics?.name || "Unassigned");
            loadItems();
        }
    }

    // Point 3 & 4: Add Product with Master Search
    async function openAddModal(warehouse) {
        if (currentRole !== 'admin' && currentRole !== warehouse.toLowerCase()) {
            return alert("Access Denied for " + warehouse);
        }
        
        const name = prompt("Enter Item Name (Autocomplete will learn this):");
        const brand = prompt("Enter Brand:");
        const isLube = confirm("Is this a Lubricant? (Cancel for Spare)");
        const qty = prompt("Quantity:", "1");
        const price = prompt("Price per unit:");

        if (name && qty && price) {
            // Save to Master for future autocomplete (Upsert)
            await supabaseClient.from('product_master').upsert({ item_name: name, brand: brand, warehouse_type: warehouse });
            
            // Save to Job
            await supabaseClient.from('job_card_items').insert({
                job_card_id: jobId,
                warehouse_type: warehouse,
                item_name: name + " (" + brand + ")",
                qty: qty,
                unit_price: price
            });
            loadItems();
        }
    }

    async function loadItems() {
        const { data } = await supabaseClient.from('job_card_items').select('*').eq('job_card_id', jobId);
        const tbody = document.getElementById('itemsBody');
        tbody.innerHTML = '';
        let total = 0;
        data?.forEach(i => {
            total += i.total_price;
            tbody.innerHTML += `<tr><td>${i.warehouse_type}</td><td>${i.item_name}</td><td>${i.qty}</td><td>₹${i.total_price}</td><td>×</td></tr>`;
        });
        document.getElementById('grandTotal').innerText = total;
    }

    loadJob();
</script>
</body>
</html>
