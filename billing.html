<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill - My Care</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --warning: #f1c40f; --light: #f4f7f6; }
        body { font-family: sans-serif; background: var(--light); padding: 15px; margin: 0; }
        .bill-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .job-info { background: #eef2f3; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid var(--warning); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        label { display: block; margin-top: 8px; font-size: 0.8rem; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .total-box { background: var(--primary); color: white; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: center; }
        .btn-close { background: var(--success); color: white; width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
<div class="bill-card">
    <h2>Final Bill</h2>
    <div id="jobHeader" class="job-info">Loading initial complaint...</div>

    <div class="grid">
        <div><label>Green Spares</label><input type="number" id="gSpares" value="0" oninput="calc()"></div>
        <div><label>Moped Spares</label><input type="number" id="mSpares" value="0" oninput="calc()"></div>
        <div><label>Lubricants</label><input type="number" id="lube" value="0" oninput="calc()"></div>
        <div><label>Labour Charges</label><input type="number" id="labour" value="0" oninput="calc()"></div>
        <div><label>Lathe Work</label><input type="number" id="lathe" value="0" oninput="calc()"></div>
        <div><label>Spare Mgr Adv</label><input type="number" id="prePaid" value="0" oninput="calc()"></div>
    </div>

    <div class="grid">
        <div><label>Flat Disc</label><input type="number" id="flatD" value="0" oninput="calc()"></div>
        <div><label>Percent Disc</label><input type="number" id="percD" value="0" oninput="calc()"></div>
    </div>

    <div class="total-box">
        <small>FINAL TO COLLECT</small>
        <div style="font-size: 2rem;">₹<span id="gTotal">0</span></div>
    </div>
    <button class="btn-close" onclick="finalize()">CLOSE JOB & WHATSAPP</button>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get('id');
    const SB_URL = "https://jycoirrphpvxkrwrjcwf.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    async function loadJob() {
        const { data } = await supabaseClient.from('job_cards').select('*, vehicles(*)').eq('id', jobId).single();
        if (data) {
            document.getElementById('jobHeader').innerHTML = `
                <strong>Reg No:</strong> ${data.vehicles.reg_number}<br>
                <strong>Complaint:</strong> ${data.problem_mentioned || 'None'}<br>
                <strong>Initial Estimate:</strong> ₹${data.estimate_given || 0}
            `;
        }
    }

    function calc() {
        const fields = ['gSpares', 'mSpares', 'lube', 'labour', 'lathe'];
        let sub = fields.reduce((s, id) => s + (parseFloat(document.getElementById(id).value) || 0), 0);
        let disc = (sub - (parseFloat(document.getElementById('flatD').value) || 0));
        let final = (disc - (disc * ((parseFloat(document.getElementById('percD').value) || 0) / 100))) - (parseFloat(document.getElementById('prePaid').value) || 0);
        document.getElementById('gTotal').innerText = Math.round(final);
    }

    async function finalize() {
        const labourAmt = parseFloat(document.getElementById('labour').value) || 0;
        const totalAmt = document.getElementById('gTotal').innerText;
        const { data: job } = await supabaseClient.from('job_cards').update({
            status: 'Closed', green_total: document.getElementById('gSpares').value, moped_total: document.getElementById('mSpares').value, 
            lubricant_total: document.getElementById('lube').value, labour_charges: labourAmt, lathe_welding: document.getElementById('lathe').value,
            advance_paid: document.getElementById('prePaid').value, total_invoice_value: totalAmt
        }).eq('id', jobId).select('*, mechanics(commission_rate)').single();

        if (job) {
            const comm = (labourAmt * (job.mechanics.commission_rate / 100));
            await supabaseClient.from('staff_ledger').insert({ mechanic_id: job.mech_id, amount: comm, entry_type: 'EARNING' });
            window.location.href = 'index.html';
        }
    }
    loadJob();
</script>
</body>
</html>
