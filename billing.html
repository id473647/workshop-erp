<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor Billing Console - My Care ERP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #2c3e50; --success: #27ae60; --moped: #3498db; --service: #f39c12; 
            --light: #f8fafc; --border: #e2e8f0; --text: #1e293b;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--light); margin: 0; padding-bottom: 130px; color: var(--text); }
        
        /* Universal Formatting Rules #1 and #2: Bound layout with centered Home action */
        .sticky-nav { 
            max-width: 950px; 
            margin: 0 auto; 
            background: white; 
            padding: 12px 20px; 
            border-bottom: 1px solid var(--border); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-sizing: border-box; 
        }
        .nav-anchor { font-size: 0.85rem; font-weight: 700; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 4px; }
        .center-home-btn { font-weight: 700; color: var(--primary); text-decoration: none; padding: 4px 12px; background: #f1f5f9; border-radius: 6px; border: 1px solid var(--border); font-size: 0.8rem; }
        .badge-role { background: var(--success); color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }

        .container { max-width: 950px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        
        /* Asset Banner Context */
        .context-banner { background: white; padding: 16px 20px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .context-meta { display: flex; flex-direction: column; gap: 4px; }
        .plate-header { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin: 0; display: flex; align-items: center; gap: 12px; }
        .meta-text { font-size: 0.85rem; color: #64748b; }
        .edit-trigger-btn { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: none; }
        .prepaid-badge { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; }

        /* Scoped Part Tools */
        .action-toolbar { display: flex; gap: 12px; margin-bottom: 20px; }
        .stack-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 700; color: white; cursor: pointer; }
        .btn-green { background: var(--success); }
        .btn-moped { background: var(--moped); }
        .btn-lube { background: #475569; }

        /* Dynamic Table Array Engine */
        .table-wrapper { background: white; border-radius: 10px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th { background: #f8fafc; padding: 12px 16px; font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 10px 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        
        /* Direct Layout Rule #4: Integrated native parameter table cell modification layout */
        .inline-input { width: 75px; padding: 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; font-weight: 700; color: var(--primary); text-align: center; }
        .inline-input:focus { border-color: var(--info); outline: none; }
        
        .pill-warehouse { padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; color: white; }
        .ware-green { background: var(--success); }
        .ware-moped { background: var(--moped); }
        .row-destroyer { color: #ef4444; font-weight: 700; cursor: pointer; border: none; background: none; font-size: 1.2rem; padding: 0 4px; }

        /* Modulators Matrix */
        .parameter-matrix { background: white; padding: 20px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 24px; }
        .matrix-title { font-size: 0.95rem; font-weight: 700; color: var(--primary); margin: 0 0 16px 0; }
        .inputs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .field-group { display: flex; flex-direction: column; gap: 4px; }
        .field-group label { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .field-group input { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }

        /* Edit Dialog Scope Overlay */
        .overlay-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); z-index: 200; display: none; justify-content: center; align-items: center; }
        .modal-body { background: white; padding: 24px; border-radius: 12px; width: 100%; max-width: 450px; box-sizing: border-box; }

        /* Command Execution Footer */
        .action-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; z-index: 100; }
        .aggregate-net { font-size: 1.35rem; font-weight: 700; color: var(--success); }
        .btn-group { display: flex; gap: 10px; }
        .btn-draft { padding: 12px 18px; background: #e2e8f0; color: #334155; border: none; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
        .btn-process { padding: 12px 20px; background: var(--success); color: white; border: none; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: none; }
    </style>
</head>
<body>

<nav class="sticky-nav">
    <a href="index.html" class="nav-anchor">← LEAVE LEDGER</a>
    <a href="index.html" class="center-home-btn">🏠 HOME</a>
    <span id="roleTag" class="badge-role">GUEST</span>
</nav>

<div class="container">
    <div id="bannerAsset" class="context-banner">
        <div class="context-meta">
            <div class="plate-header">
                <span id="regPlate">Loading active instance...</span>
                <button id="btnTriggerEditModal" class="edit-trigger-btn" onclick="openModificationModal()">✏️ EDIT SPEC & TECH</button>
            </div>
            <span id="modelLabel" class="meta-text">Syncing pipeline mapping...</span>
            <span id="mechLabel" class="meta-text" style="color:var(--primary); font-weight:700;">Assigned Tech: --</span>
        </div>
        <div id="prepaidPill" class="prepaid-badge">Prepaid Advance: ₹0</div>
    </div>

    <div id="barGreen" class="action-toolbar" style="display:none;">
        <button class="stack-btn btn-green" onclick="injectLineNode('Green', false)">+ ADD GREEN SPARE</button>
        <button class="stack-btn btn-lube" onclick="injectLineNode('Green', true)">+ ADD GREEN LUBE (ML)</button>
    </div>

    <div id="barMoped" class="action-toolbar" style="display:none;">
        <button class="stack-btn btn-moped" onclick="injectLineNode('Moped', false)">+ ADD MOPED SPARE</button>
        <button class="stack-btn btn-lube" onclick="injectLineNode('Moped', true)">+ ADD MOPED LUBE (ML)</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Warehouse</th>
                    <th>Product Context / Brand</th>
                    <th>Scalar Unit</th>
                    <th>Unit Rate (₹)</th>
                    <th>Total Valuation (₹)</th>
                    <th id="columnDestroyer" style="width:36px; display:none;"></th>
                </tr>
            </thead>
            <tbody id="lineItemsContainer"></tbody>
        </table>
    </div>

    <div id="matrixParameters" class="parameter-matrix">
        <div class="matrix-title">Overarching Service Costs Scope</div>
        <div class="inputs-grid">
            <div class="field-group"><label>Allocated Labour (₹)</label><input type="number" id="vLabour" value="0" min="0" oninput="compileDynamicSums()"></div>
            <div class="field-group"><label>Lathe Contract Work (₹)</label><input type="number" id="vLathe" value="0" min="0" oninput="compileDynamicSums()"></div>
            <div class="field-group"><label>Applied Concession (₹)</label><input type="number" id="vFlatDisc" value="0" min="0" oninput="compileDynamicSums()"></div>
            <div class="field-group"><label>Prepaid Advance Allocation (₹)</label><input type="number" id="vAdvance" value="0" min="0" oninput="compileDynamicSums()"></div>
        </div>
    </div>
</div>

<div id="modalEditJob" class="overlay-modal">
    <div class="modal-body">
        <h3 style="margin:0 0 14px 0; color:var(--primary);">Modify Core Job Constraints</h3>
        <div style="display:flex; flex-direction:column; gap:12px;">
            <div class="field-group">
                <label>Active Work Directive / Faults</label>
                <textarea id="modalProblem" rows="3" style="padding:8px; border-radius:6px; border:1px solid var(--border);"></textarea>
            </div>
            <div class="field-group"><label>Allocated Budget Estimate (₹)</label><input type="number" id="modalEstimate" min="0"></div>
            <div class="field-group"><label>Reassign Assigned Technician</label><select id="modalMechSelect" style="padding:8px; border-radius:6px; border:1px solid var(--border);"></select></div>
            <div style="display:flex; gap:10px; margin-top:8px;">
                <button class="stack-btn btn-green" onclick="commitJobModifications()">COMMIT REVISIONS</button>
                <button class="stack-btn" style="background:#e2e8f0; color:#334155;" onclick="document.getElementById('modalEditJob').style.display='none'">CANCEL</button>
            </div>
        </div>
    </div>
</div>

<div class="action-footer">
    <div>
        <span style="font-size:0.7rem; font-weight:700; color:#64748b; text-transform:uppercase; display:block;">Invoice Net Obligation</span>
        <div id="netValuationDisplay" class="aggregate-net">₹0</div>
    </div>
    <div class="btn-group">
        <button class="btn-draft" onclick="executeRuntimeDraftSave()">💾 SAVE DRAFT VALUES</button>
        <button id="btnProcessInvoice" class="btn-process" onclick="commitInvoiceClosure()">PROCESS TO BILL</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetJobId = urlParams.get('id');
    const SB_URL = "https://jycoirrphpvxkrwrjcwf.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    const sessionRole = localStorage.getItem('ERP_ACTIVE_ROLE') || 'guest';
    let lineItemsLocalMemory = [];

    function secureRbacVisibility() {
        document.getElementById('roleTag').innerText = sessionRole;
        if(sessionRole === 'green' || sessionRole === 'admin') document.getElementById('barGreen').style.display = 'flex';
        if(sessionRole === 'moped' || sessionRole === 'admin') document.getElementById('barMoped').style.display = 'flex';
        if(sessionRole === 'service' || sessionRole === 'admin') {
            document.getElementById('btnTriggerEditModal').style.display = 'inline-block';
            document.getElementById('btnProcessInvoice').style.display = 'block';
            document.getElementById('columnDestroyer').style.display = 'table-cell';
        }
        if(sessionRole === 'green' || sessionRole === 'moped') document.getElementById('columnDestroyer').style.display = 'table-cell';
    }

    async function initializeJobContext() {
        if(!targetJobId) return;
        const { data: job } = await supabaseClient.from('job_cards').select('*, vehicles(*), mechanics(name)').eq('id', targetJobId).single();
        if(job) {
            document.getElementById('bannerAsset').style.borderLeft = `6px solid var(--${job.source_role || 'service'})`;
            document.getElementById('regPlate').innerText = job.vehicles?.reg_number || "DIRECT ASSET";
            document.getElementById('modelLabel').innerText = `${job.vehicles?.make_model || 'Standard'} | Stated Directive: ${job.problem_mentioned || 'N/A'} | Budget: ₹${job.estimate_given || 0}`;
            document.getElementById('mechLabel').innerText = `Floor Technician: ${job.mechanics?.name || 'Unassigned'}`;
            document.getElementById('prepaidPill').innerText = `Prepaid Advance: ₹${parseFloat(job.advance_paid) || 0}`;

            document.getElementById('vLabour').value = parseFloat(job.labour_charges) || 0;
            document.getElementById('vLathe').value = parseFloat(job.lathe_welding) || 0;
            document.getElementById('vAdvance').value = parseFloat(job.advance_paid) || 0;

            document.getElementById('modalProblem').value = job.problem_mentioned || '';
            document.getElementById('modalEstimate').value = parseFloat(job.estimate_given) || 0;

            loadInventoryLedgers();
        }
    }

    async function loadInventoryLedgers() {
        if(!targetJobId) return;
        const { data: items } = await supabaseClient.from('job_card_items').select('*').eq('job_card_id', targetJobId).order('created_at', { ascending: true });
        lineItemsLocalMemory = items || [];
        renderDynamicTable();
    }

    // --- RULE #3 & #4 IMPLEMENTATION: FULL INLINE EDITING ENGINE ---
    function renderDynamicTable() {
        const tbody = document.getElementById('lineItemsContainer');
        tbody.innerHTML = '';
        
        lineItemsLocalMemory.forEach((line, index) => {
            const dropAuth = sessionRole === 'admin' || sessionRole === 'service' || sessionRole === line.warehouse_type.toLowerCase();
            const actionNode = dropAuth ? `<button class="row-destroyer" onclick="dropActiveRow('${line.id}')">×</button>` : '';

            // Rule #3 Logic Integration: Automatically decoupling Lube multipliers natively
            let resolvedDefaultTotal = parseFloat(line.total_price);
            if(isNaN(resolvedDefaultTotal)) {
                resolvedDefaultTotal = line.unit_metric === 'ML' ? parseFloat(line.unit_price) : (line.qty * line.unit_price);
            }

            tbody.innerHTML += `
                <tr>
                    <td><span class="pill-warehouse ware-${line.warehouse_type.toLowerCase()}">${line.warehouse_type}</span></td>
                    <td><strong>${line.item_name}</strong></td>
                    <td>
                        <div style="display:flex; align-items:center; gap:4px;">
                            <input type="number" class="inline-input" value="${line.qty}" min="0" step="any" onchange="updateInlineScalar(${index}, 'qty', this.value)">
                            <span style="font-size:0.75rem; color:#888;">${line.unit_metric || ''}</span>
                        </div>
                    </td>
                    <td><input type="number" class="inline-input" value="${line.unit_price}" min="0" step="any" onchange="updateInlineScalar(${index}, 'unit_price', this.value)"></td>
                    <td><input type="number" class="inline-input" value="${resolvedDefaultTotal}" min="0" step="any" onchange="updateInlineScalar(${index}, 'total_price', this.value)"></td>
                    <td style="display:${document.getElementById('columnDestroyer').style.display}; text-align:center;">${actionNode}</td>
                </tr>`;
        });
        compileDynamicSums();
    }

    // Dynamic runtime scalar updates processing real-time table elements directly
    async function updateInlineScalar(indexIndex, fieldName, newValNumeric) {
        const targetObj = lineItemsLocalMemory[indexIndex];
        const cleanVal = parseFloat(newValNumeric) || 0;
        targetObj[fieldName] = cleanVal;

        // Apply native mathematical resolving loop mappings internally
        if(fieldName === 'qty' || fieldName === 'unit_price') {
            targetObj.total_price = targetObj.unit_metric === 'ML' ? targetObj.unit_price : (targetObj.qty * targetObj.unit_price);
        }

        // Seamless database background writing execution
        await supabaseClient.from('job_card_items').update({
            qty: targetObj.qty,
            unit_price: targetObj.unit_price,
            total_price: targetObj.total_price
        }).eq('id', targetObj.id);

        renderDynamicTable();
    }

    async function injectLineNode(warehouseTarget, isVolumetric) {
        if(!targetJobId) return alert("Execution Interlock: Target Job Card context mapping incomplete.");

        const itemType = isVolumetric ? "Volumetric Fluid Lube" : "Discrete Component Item";
        const partName = prompt(`Input targeted ${itemType} spec descriptor:`);
        if(!partName || !partName.trim()) return;

        const partBrand = prompt(`Input manufacturing source brand:`, "Standard OEM");
        const quantityRaw = prompt(isVolumetric ? "Numeric Volume in ML:" : "Discrete Quantity Scalar:", isVolumetric ? "900" : "1");
        if(!quantityRaw) return;

        const unitCost = prompt(`Define Unit Charge Allocation Rate (₹):`);
        if(!unitCost) return;

        const cleanQty = parseFloat(quantityRaw) || 1;
        const cleanRate = parseFloat(unitCost) || 0;
        const appliedSuffix = isVolumetric ? "ML" : "Pcs";
        const integratedStringSpec = `${partName.trim()} (${partBrand ? partBrand.trim() : 'Standard'})`;

        // Direct implementation Rule #3: Real-time absolute overrides mapping volumetric outputs
        const calculatedInitialTotal = isVolumetric ? cleanRate : (cleanQty * cleanRate);

        supabaseClient.from('product_master').upsert({ item_name: partName.trim(), brand: partBrand || 'Standard', warehouse_type: warehouseTarget }).then();

        const { error } = await supabaseClient.from('job_card_items').insert({
            job_card_id: targetJobId,
            warehouse_type: warehouseTarget,
            item_name: integratedStringSpec,
            qty: cleanQty,
            unit_metric: appliedSuffix,
            unit_price: cleanRate,
            total_price: calculatedInitialTotal
        });

        if(error) alert(`⚠️ INSERTION ERROR:\n${error.message}`);
        else loadInventoryLedgers();
    }

    async function dropActiveRow(nodeId) {
        if(confirm("Confirm dropping item array element?")) {
            await supabaseClient.from('job_card_items').delete().eq('id', nodeId);
            loadInventoryLedgers();
        }
    }

    function compileDynamicSums() {
        let itemsGross = 0;
        lineItemsLocalMemory.forEach(line => {
            let rowVal = parseFloat(line.total_price);
            if(isNaN(rowVal)) rowVal = line.unit_metric === 'ML' ? parseFloat(line.unit_price) : (line.qty * line.unit_price);
            itemsGross += rowVal;
        });

        const l = parseFloat(document.getElementById('vLabour').value) || 0;
        const t = parseFloat(document.getElementById('vLathe').value) || 0;
        const d = parseFloat(document.getElementById('vFlatDisc').value) || 0;
        const a = parseFloat(document.getElementById('vAdvance').value) || 0;

        const netAggregate = (itemsGross + l + t - d) - a;
        document.getElementById('netValuationDisplay').innerText = "₹" + Math.round(netAggregate);
    }

    async function openModificationModal() {
        const { data: staff } = await supabaseClient.from('mechanics').select('id, name').eq('is_active', true).order('name');
        const sel = document.getElementById('modalMechSelect');
        sel.innerHTML = '<option value="">-- Clear Allocation Mapping --</option>';
        staff?.forEach(m => { sel.innerHTML += `<option value="${m.id}">${m.name}</option>`; });
        document.getElementById('modalEditJob').style.display = 'flex';
    }

    async function commitJobModifications() {
        await supabaseClient.from('job_cards').update({
            problem_mentioned: document.getElementById('modalProblem').value.trim(),
            estimate_given: parseFloat(document.getElementById('modalEstimate').value) || 0,
            mech_id: document.getElementById('modalMechSelect').value || null
        }).eq('id', targetJobId);
        document.getElementById('modalEditJob').style.display = 'none';
        initializeJobContext();
    }

    async function executeRuntimeDraftSave() {
        const evaluatedNet = document.getElementById('netValuationDisplay').innerText.replace('₹','');
        await supabaseClient.from('job_cards').update({
            total_invoice_value: evaluatedNet,
            labour_charges: parseFloat(document.getElementById('vLabour').value) || 0,
            lathe_welding: parseFloat(document.getElementById('vLathe').value) || 0,
            advance_paid: parseFloat(document.getElementById('vAdvance').value) || 0
        }).eq('id', targetJobId);
        
        // Confirmation alert native verification output
        alert("Draft state compiled natively. Pipeline tracking metrics secured across general views.");
    }

    async function commitInvoiceClosure() {
        await executeRuntimeDraftSave();
        await supabaseClient.from('job_cards').update({ status: 'Closed' }).eq('id', targetJobId);
        alert("Final invoice settlement authorization executed successfully.");
        window.location.href = 'index.html';
    }

    secureRbacVisibility();
    initializeJobContext();
</script>
</body>
</html>
