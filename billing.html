<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor Billing Console - My Care ERP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --moped: #3498db; --service: #f39c12; --light: #f8fafc; --border: #e2e8f0; --text: #1e293b; --danger: #ef4444; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--light); margin: 0; padding-bottom: 140px; color: var(--text); }
        .sticky-nav { max-width: 950px; margin: 0 auto; background: white; padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; box-sizing: border-box; }
        .nav-anchor { font-size: 0.85rem; font-weight: 700; color: var(--primary); text-decoration: none; }
        .center-home-btn { font-weight: 700; color: var(--primary); text-decoration: none; padding: 4px 12px; background: #f1f5f9; border-radius: 6px; border: 1px solid var(--border); font-size: 0.8rem; }
        .badge-role { background: var(--success); color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .container { max-width: 950px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        .context-banner { background: white; padding: 18px 22px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .plate-header { font-size: 1.35rem; font-weight: 700; color: var(--primary); margin: 0; }
        .meta-text { font-size: 0.85rem; color: #64748b; }
        .prepaid-badge { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; padding: 6px 14px; border-radius: 6px; font-weight: 700; }
        .table-wrapper { background: white; border-radius: 10px; border: 1px solid var(--border); overflow-x: auto; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th { background: #f8fafc; padding: 12px 16px; font-size: 0.75rem; font-weight: 700; color: #64748b; border-bottom: 1px solid var(--border); }
        td { padding: 10px 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        
        /* Interactive Inline Addition Bar aligned with POS style */
        .inline-add-strip { display: grid; grid-template-columns: 2fr 1.5fr 1fr 1fr 1fr auto; gap: 8px; background: #f8fafc; padding: 12px; border-bottom: 2px solid var(--border); position: relative; align-items: center; }
        .inline-add-strip input, .inline-add-strip select { padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; width: 100%; box-sizing: border-box; }
        .btn-add-line { background: var(--success); color: white; border: none; width: 32px; height: 32px; border-radius: 6px; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
        
        .autocomplete-container { position: absolute; top: 100%; left: 0; background: white; border: 1px solid var(--border); border-radius: 6px; max-height: 160px; overflow-y: auto; z-index: 50; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: none; }
        .autocomplete-item { padding: 8px 12px; font-size: 0.85rem; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        .autocomplete-item:hover { background: #f0f7ff; }

        .inline-input { width: 85px; padding: 6px; border: 1px solid var(--border); border-radius: 6px; font-weight: 700; text-align: center; }
        .pill-warehouse { padding: 3px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; color: white; }
        .ware-green { background: var(--success); } .ware-moped { background: var(--moped); }
        .row-destroyer { color: var(--danger); font-weight: 700; cursor: pointer; border: none; background: none; font-size: 1.2rem; }
        
        .parameter-matrix { background: white; padding: 22px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 24px; }
        .inputs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .field-group { display: flex; flex-direction: column; gap: 4px; }
        .field-group label { font-size: 0.75rem; font-weight: 700; color: #64748b; }
        .field-group input { padding: 10px; border: 1px solid var(--border); border-radius: 6px; }

        .action-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; z-index: 100; }
        .btn-action-sm { padding: 12px 16px; border: none; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-left: 8px; }
        .btn-draft { background: #e2e8f0; color: #334155; } .btn-print { background: var(--primary); color: white; }
    </style>
</head>
<body>

<nav class="sticky-nav">
    <a href="index.html" class="nav-anchor">← FLOOR CONSOLE</a>
    <a href="index.html" class="center-home-btn">🏠 HOME</a>
    <span id="roleTag" class="badge-role">GUEST</span>
</nav>

<div class="container">
    <div id="bannerAsset" class="context-banner">
        <div>
            <div class="plate-header" id="regPlate">Loading active instance...</div>
            <span id="modelLabel" class="meta-text">Syncing pipeline maps...</span>
            <span id="mechLabel" class="meta-text" style="color:var(--primary); font-weight:700; display:block;">Assigned Tech: --</span>
        </div>
        <div id="prepaidPill" class="prepaid-badge">Prepaid Advance: ₹0</div>
    </div>

    <div class="table-wrapper">
        <div id="inlineAddStrip" class="inline-add-strip" style="display:none;">
            <div style="position:relative;">
                <input type="text" id="nPart" placeholder="Part Description" oninput="queryCatalogAutocomplete(this)" autocomplete="off">
                <div id="autolist-n" class="autocomplete-container"></div>
            </div>
            <input type="text" id="nBrand" placeholder="BRAND" oninput="this.value=this.value.toUpperCase()">
            <select id="nType">
                <option value="Spare">Spare (Pcs)</option>
                <option value="Lube">Lube (ML)</option>
            </select>
            <input type="number" id="nQty" placeholder="Qty / ML" value="1" min="1">
            <input type="number" id="nRate" placeholder="Rate (₹)" value="0" min="0">
            <button class="btn-add-line" onclick="pushItemToJobCard()">+</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Warehouse</th><th>Product Context</th><th>Scalar Unit</th><th>Unit Rate</th><th>Valuation</th><th id="columnDestroyer" style="display:none;"></th>
                </tr>
            </thead>
            <tbody id="lineItemsContainer"></tbody>
        </table>
    </div>

    <div class="parameter-matrix">
        <h4 style="margin:0 0 16px 0; color:var(--primary);">Overarching Service Scope</h4>
        <div class="inputs-grid">
            <div class="field-group"><label>Allocated Labour (₹)</label><input type="number" id="vLabour" value="0" oninput="compileDynamicSums()"></div>
            <div class="field-group"><label>Lathe Contract Work (₹)</label><input type="number" id="vLathe" value="0" oninput="compileDynamicSums()"></div>
            <div class="field-group"><label>Applied Concession (₹)</label><input type="number" id="vFlatDisc" value="0" oninput="compileDynamicSums()"></div>
            <div class="field-group"><label>Prepaid Deposit (Green Ledger)</label><input type="number" id="vAdvance" value="0" oninput="compileDynamicSums()"></div>
        </div>
    </div>
</div>

<div class="action-footer">
    <div>
        <span style="font-size:0.7rem; font-weight:700; color:#64748b; text-transform:uppercase;">Invoice Net</span>
        <div id="netValuationDisplay" style="font-size:1.4rem; font-weight:700; color:var(--success);">₹0</div>
    </div>
    <div>
        <button class="btn-action-sm btn-draft" onclick="executeRuntimeDraftSave()">💾 SAVE DRAFT</button>
        <button class="btn-action-sm btn-print" onclick="window.location.href='index.html'">🖨️ RETURN</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetJobId = urlParams.get('id');
    const SB_URL = "https://jycoirrphpvxkrwrjcwf.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    const sessionRole = localStorage.getItem('ERP_ACTIVE_ROLE') || 'guest';
    let lineItemsLocalMemory = [];
    let globalCatalogCache = [];

    async function initializeJobContext() {
        document.getElementById('roleTag').innerText = sessionRole;
        if(sessionRole === 'green' || sessionRole === 'moped' || sessionRole === 'admin') {
            document.getElementById('inlineAddStrip').style.display = 'grid';
            document.getElementById('columnDestroyer').style.display = 'table-cell';
            prefetchCentralCatalog();
        }

        const { data: job } = await supabaseClient.from('job_cards').select('*, vehicles(*), mechanics(name)').eq('id', targetJobId).single();
        if(job) {
            document.getElementById('regPlate').innerText = job.vehicles?.reg_number || "ASSET";
            document.getElementById('modelLabel').innerText = `${job.vehicles?.make_model || ''} | Budget: ₹${job.estimate_given || 0}`;
            document.getElementById('mechLabel').innerText = `Floor Tech: ${job.mechanics?.name || 'Unassigned'}`;
            document.getElementById('prepaidPill').innerText = `Green Advance: ₹${parseFloat(job.advance_paid) || 0}`;

            document.getElementById('vLabour').value = parseFloat(job.labour_charges) || 0;
            document.getElementById('vLathe').value = parseFloat(job.lathe_welding) || 0;
            document.getElementById('vAdvance').value = parseFloat(job.advance_paid) || 0;

            loadInventoryLedgers();
        }
    }

    async function loadInventoryLedgers() {
        const { data: items } = await supabaseClient.from('job_card_items').select('*').eq('job_card_id', targetJobId).order('created_at', { ascending: true });
        lineItemsLocalMemory = items || [];
        renderDynamicTable();
    }

    function renderDynamicTable() {
        const tbody = document.getElementById('lineItemsContainer'); tbody.innerHTML = '';
        lineItemsLocalMemory.forEach((line, idx) => {
            const dropAuth = sessionRole === 'admin' || sessionRole === 'service' || sessionRole === line.warehouse_type.toLowerCase();
            const actionNode = dropAuth ? `<button class="row-destroyer" onclick="dropActiveRow('${line.id}')">×</button>` : '';
            let evaluatedLineTotal = parseFloat(line.total_price);
            if(isNaN(evaluatedLineTotal)) evaluatedLineTotal = line.unit_metric === 'ML' ? parseFloat(line.unit_price) : (line.qty * line.unit_price);

            tbody.innerHTML += `<tr>
                <td><span class="pill-warehouse ware-${line.warehouse_type.toLowerCase()}">${line.warehouse_type}</span></td>
                <td><strong>${line.item_name}</strong></td>
                <td><input type="number" class="inline-input" value="${line.qty}" onchange="updateInlineScalar(${idx}, 'qty', this.value)"> ${line.unit_metric||''}</td>
                <td><input type="number" class="inline-input" value="${line.unit_price}" onchange="updateInlineScalar(${idx}, 'unit_price', this.value)"></td>
                <td>₹${evaluatedLineTotal}</td>
                <td style="display:${document.getElementById('columnDestroyer').style.display}; text-align:center;">${actionNode}</td>
            </tr>`;
        });
        compileDynamicSums();
    }

    // Interactive Auto-Complete Arrays natively mapping into inline layout bounds
    async function prefetchCentralCatalog() {
        const { data: master } = await supabaseClient.from('product_master').select('*');
        globalCatalogCache = master || [];
    }

    function queryCatalogAutocomplete(inputRef) {
        const searchVal = inputRef.value.trim().toLowerCase();
        const listContainer = document.getElementById('autolist-n'); listContainer.innerHTML = '';
        if(searchVal.length < 2) { listContainer.style.display = 'none'; return; }
        
        const filtered = globalCatalogCache.filter(item => item.item_name.toLowerCase().includes(searchVal)).slice(0, 10);
        if(filtered.length > 0) {
            filtered.forEach(p => {
                listContainer.innerHTML += `<div class="autocomplete-item" onmousedown="applySelectedCatalogItem('${p.item_name.replace(/'/g,"\\'")}', '${p.brand.replace(/'/g,"\\'")}', ${p.default_price || 0})"><strong>${p.item_name}</strong> (${p.brand})</div>`;
            });
            listContainer.style.display = 'block';
        } else listContainer.style.display = 'none';
    }

    function hideAutocomplete() { setTimeout(() => { document.getElementById('autolist-n').style.display = 'none'; }, 200); }

    function applySelectedCatalogItem(nameStr, brandStr, defaultRate) {
        document.getElementById('nPart').value = nameStr; document.getElementById('nBrand').value = brandStr; document.getElementById('nRate').value = defaultRate;
        document.getElementById('autolist-n').style.display = 'none';
    }

    // Native inline insertion replacing legacy prompt boxes directly
    async function pushItemToJobCard() {
        const partStr = document.getElementById('nPart').value.trim();
        const brandStr = document.getElementById('nBrand').value.trim() || 'STANDARD';
        const typeSelect = document.getElementById('nType').value;
        const qVal = parseFloat(document.getElementById('nQty').value) || 1;
        const rVal = parseFloat(document.getElementById('nRate').value) || 0;

        if(!partStr) return;

        const wareTarget = sessionRole === 'moped' ? 'Moped' : 'Green';
        const metricTarget = typeSelect === 'Lube' ? 'ML' : 'Pcs';
        const calcInitialCost = typeSelect === 'Lube' ? rVal : (qVal * rVal);

        const cleanName = partStr.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        const cleanBrand = brandStr.toUpperCase();

        supabaseClient.from('product_master').upsert({ item_name: cleanName, brand: cleanBrand, warehouse_type: wareTarget }).then();

        const { error } = await supabaseClient.from('job_card_items').insert({
            job_card_id: targetJobId, warehouse_type: wareTarget, item_name: `${cleanName} (${cleanBrand})`, qty: qVal, unit_metric: metricTarget, unit_price: rVal, total_price: calcInitialCost
        });

        if(!error) {
            document.getElementById('nPart').value = ''; document.getElementById('nQty').value = '1'; document.getElementById('nRate').value = '0';
            loadInventoryLedgers();
        }
    }

    async function updateInlineScalar(indexTarget, fieldTarget, stringValNumeric) {
        const itemContext = lineItemsLocalMemory[indexTarget];
        itemContext[fieldTarget] = parseFloat(stringValNumeric) || 0;
        itemContext.total_price = itemContext.unit_metric === 'ML' ? itemContext.unit_price : (itemContext.qty * itemContext.unit_price);
        await supabaseClient.from('job_card_items').update({ qty: itemContext.qty, unit_price: itemContext.unit_price, total_price: itemContext.total_price }).eq('id', itemContext.id);
        renderDynamicTable();
    }

    async function dropActiveRow(nodeIdHash) {
        if(confirm("Confirm dropping inventory array line?")) {
            await supabaseClient.from('job_card_items').delete().eq('id', nodeIdHash); loadInventoryLedgers();
        }
    }

    function compileDynamicSums() {
        let cumulativeItemsValuation = 0;
        lineItemsLocalMemory.forEach(line => {
            let rowNet = parseFloat(line.total_price);
            if(isNaN(rowNet)) rowNet = line.unit_metric === 'ML' ? parseFloat(line.unit_price) : (line.qty * line.unit_price);
            cumulativeItemsValuation += rowNet;
        });
        const l = parseFloat(document.getElementById('vLabour').value) || 0; const t = parseFloat(document.getElementById('vLathe').value) || 0;
        const d = parseFloat(document.getElementById('vFlatDisc').value) || 0; const a = parseFloat(document.getElementById('vAdvance').value) || 0;

        document.getElementById('netValuationDisplay').innerText = "₹" + Math.round((cumulativeItemsValuation + l + t - d) - a);
    }

    async function executeRuntimeDraftSave() {
        await supabaseClient.from('job_cards').update({
            total_invoice_value: document.getElementById('netValuationDisplay').innerText.replace('₹',''),
            labour_charges: parseFloat(document.getElementById('vLabour').value) || 0, lathe_welding: parseFloat(document.getElementById('vLathe').value) || 0, advance_paid: parseFloat(document.getElementById('vAdvance').value) || 0
        }).eq('id', targetJobId);
        alert("Draft saved safely.");
    }

    initializeJobContext();
</script>
</body>
</html>
