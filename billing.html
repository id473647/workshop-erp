<!DOCTYPE html>
<html>
<head>
    <title>Bill - My Care</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 15px; margin: 0; }
        .bill-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .bill-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .logo-bill { height: 40px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        label { display: block; margin-top: 8px; font-size: 0.75rem; color: #666; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .total-box { background: #2c3e50; color: white; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: center; }
        .btn-close { background: #27ae60; color: white; width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="bill-card">
    <div class="bill-head">
        <img src="logo-main.jpg" class="logo-bill" onerror="this.style.display='none'">
        <div style="text-align: right;">
            <h2 style="margin:0; font-size: 1rem;">FINAL INVOICE</h2>
            <img src="logo-green.png" style="height:20px; opacity:0.6;" onerror="this.style.display='none'">
        </div>
    </div>

    <div id="jobHeader" style="background:#f9f9f9; padding:10px; border-radius:8px; margin-bottom:15px; font-size:0.9rem;">
        Fetching details...
    </div>

    <div class="grid">
        <div><label>Green Spares</label><input type="number" id="gSpares" value="0" oninput="calc()"></div>
        <div><label>Moped Spares</label><input type="number" id="mSpares" value="0" oninput="calc()"></div>
        <div><label>Lubricants</label><input type="number" id="lube" value="0" oninput="calc()"></div>
        <div><label>Labour</label><input type="number" id="labour" value="0" oninput="calc()"></div>
        <div><label>Lathe (₹)</label><input type="number" id="lathe" value="0" oninput="calc()"></div>
        <div><label>Lathe Pmt</label><select id="latheStatus"><option value="Pending">Pending</option><option value="Paid">Paid</option></select></div>
    </div>

    <div class="grid" style="border-top:1px solid #eee; padding-top:10px;">
        <div><label>Flat Disc</label><input type="number" id="flatD" value="0" oninput="calc()"></div>
        <div><label>Percent Disc</label><input type="number" id="percD" value="0" oninput="calc()"></div>
    </div>

    <label>Future Advice</label>
    <textarea id="advice" placeholder="Advice for next service..."></textarea>

    <div class="total-box">
        <small>COLLECT PAYMENT</small>
        <div style="font-size: 2rem;">₹<span id="gTotal">0</span></div>
    </div>

    <button class="btn-close" onclick="finalize()">CLOSE JOB & WHATSAPP</button>
</div>

<script>
    // ... Copy the script logic exactly as given in the previous billing.html message ...
</script>
</body>
</html>
