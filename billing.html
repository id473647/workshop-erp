<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Job Card - My Care</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2c3e50; --green: #27ae60; --moped: #e67e22; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 10px; margin: 0; }
        .jc-container { max-width: 800px; margin: auto; background: white; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* Branding & Header */
        .jc-header { padding: 20px; border-bottom: 2px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .logo { height: 50px; }
        
        /* Role Switcher */
        .role-bar { background: #34495e; color: white; padding: 10px; display: flex; justify-content: center; gap: 20px; font-size: 0.8rem; }
        .role-btn { cursor: pointer; opacity: 0.6; }
        .role-btn.active { opacity: 1; font-weight: bold; text-decoration: underline; }

        .section { padding: 15px; border-bottom: 1px solid #eee; }
        .section-title { font-weight: bold; color: var(--primary); margin-bottom: 10px; display: flex; justify-content: space-between; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.85rem; }
        th { background: #f8f9fa; text-align: left; padding: 8px; border-bottom: 2px solid #ddd; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .type-tag { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; color: white; }
        .tag-green { background: var(--green); }
        .tag-moped { background: var(--moped); }

        .input-inline { width: 60px; padding: 4px; border: 1px solid #ddd; }
        .btn-add { font-size: 0.7rem; background: var(--primary); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-del { color: #e74c3c; cursor: pointer; font-weight: bold; }
        
        /* Footer Controls */
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #fdfdfd; padding: 15px; }
        .total-strip { background: var(--primary); color: white; padding: 20px; text-align: center; font-size: 1.5rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="jc-container">
    <div class="role-bar">
        <span>VIEWING AS:</span>
        <div id="roleSpare" class="role-btn active" onclick="setRole('spare')">SPARE MANAGER</div>
        <div id="roleWorkshop" class="role-btn" onclick="setRole('workshop')">WORKSHOP MANAGER</div>
    </div>

    <div class="jc-header">
        <img src="logo-main.jpg" class="logo" onerror="this.style.display='none'">
        <div style="text-align: right;">
            <h2 style="margin:0;">DIGITAL JOB CARD</h2>
            <div id="vehReg" style="font-weight: bold; color: var(--info);"></div>
        </div>
    </div>

    <div class="section" style="background: #fff9c4;">
        <div id="jobDetails">Loading original complaints...</div>
    </div>

    <div class="section">
        <div class="section-title">
            <span>SPARES & LUBRICANTS</span>
            <div class="spare-only">
                <button class="btn-add" onclick="addItem('Green')">+ Green Item</button>
                <button class="btn-add" onclick="addItem('Moped')">+ Moped Item</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Item Description</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th class="spare-only"></th>
                </tr>
            </thead>
            <tbody id="itemsBody">
                </tbody>
        </table>
    </div>

    <div class="controls-grid">
        <div class="mgr-only">
            <label style="display:block; font-size: 0.8rem; font-weight: bold;">Labour Charges (₹)</label>
            <input type="number" id="labour" value="0" oninput="calculateGrandTotal()" style="width:100%; padding:8px;">
            
            <label style="display:block; font-size: 0.8rem; font-weight: bold; margin-top:10px;">Lathe Work (₹)</label>
            <input type="number" id="lathe" value="0" oninput="calculateGrandTotal()" style="width:100%; padding:8px;">
        </div>
        <div class="mgr-only">
            <label style="display:block; font-size: 0.8rem; font-weight: bold;">Advance Paid (₹)</label>
            <input type="number" id="prePaid" value="0" oninput="calculateGrandTotal()" style="width:100%; padding:8px;">
            
            <label style="display:block; font-size: 0.8rem; font-weight: bold; margin-top:10px;">Discount (₹ / %)</label>
            <div style="display:flex; gap:5px;">
                <input type="number" id="flatD" placeholder="₹" oninput="calculateGrandTotal()" style="width:50%; padding:8px;">
                <input type="number" id="percD" placeholder="%" oninput="calculateGrandTotal()" style="width:50%; padding:8px;">
            </div>
        </div>
    </div>

    <div class="total-strip">
        <small style="font-size: 0.7rem; display: block; opacity: 0.8;">NET PAYABLE BY CUSTOMER</small>
        ₹<span id="grandTotal">0</span>
    </div>

    <div style="padding: 15px;">
        <button class="btn-add" style="width:100%; padding:15px; background:var(--green); font-size:1rem;" onclick="finalizeJob()">FINALIZE & CLOSE JOB</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get('id');
    const SB_URL = "https://jycoirrphpvxkrwrjcwf.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    let currentRole = 'spare';
    let sparesTotal = 0;

    // 1. Role Permission Logic
    function setRole(role) {
        currentRole = role;
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(role === 'spare' ? 'roleSpare' : 'roleWorkshop').classList.add('active');
        
        if (role === 'workshop') {
            document.querySelectorAll('.spare-only').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.mgr-only').forEach(el => el.classList.remove('hidden'));
        } else {
            document.querySelectorAll('.spare-only').forEach(el => el.classList.remove('hidden'));
            document.querySelectorAll('.mgr-only').forEach(el => el.classList.add('hidden'));
        }
    }

    // 2. Load Data
    async function loadJob() {
        const { data } = await supabaseClient.from('job_cards').select('*, vehicles(*)').eq('id', jobId).single();
        if (data) {
            document.getElementById('vehReg').innerText = data.vehicles.reg_number;
            document.getElementById('jobDetails').innerHTML = `
                <b>Original Complaint:</b> ${data.problem_mentioned || 'N/A'}<br>
                <b>Initial Estimate:</b> ₹${data.estimate_given || 0}
            `;
            loadItems();
        }
    }

    async function loadItems() {
        const { data } = await supabaseClient.from('job_card_items').select('*').eq('job_card_id', jobId);
        const tbody = document.getElementById('itemsBody');
        tbody.innerHTML = '';
        sparesTotal = 0;
        
        data?.forEach(item => {
            sparesTotal += parseFloat(item.total_price);
            tbody.innerHTML += `
                <tr>
                    <td><span class="type-tag tag-${item.warehouse_type.toLowerCase()}">${item.warehouse_type}</span></td>
                    <td>${item.item_name}</td>
                    <td>${item.qty}</td>
                    <td>₹${item.unit_price}</td>
                    <td><b>₹${item.total_price}</b></td>
                    <td class="spare-only ${currentRole === 'workshop' ? 'hidden' : ''}">
                        <span class="btn-del" onclick="deleteItem('${item.id}')">×</span>
                    </td>
                </tr>`;
        });
        calculateGrandTotal();
    }

    async function addItem(type) {
        const name = prompt("Enter Part Name:");
        const qty = prompt("Quantity:", "1");
        const price = prompt("Unit Price (₹):");
        
        if (name && qty && price) {
            await supabaseClient.from('job_card_items').insert({
                job_card_id: jobId,
                warehouse_type: type,
                item_name: name,
                qty: parseFloat(qty),
                unit_price: parseFloat(price)
            });
            loadItems();
        }
    }

    async function deleteItem(id) {
        if (confirm("Remove this item?")) {
            await supabaseClient.from('job_card_items').delete().eq('id', id);
            loadItems();
        }
    }

    function calculateGrandTotal() {
        const labour = parseFloat(document.getElementById('labour').value) || 0;
        const lathe = parseFloat(document.getElementById('lathe').value) || 0;
        const prePaid = parseFloat(document.getElementById('prePaid').value) || 0;
        const flat = parseFloat(document.getElementById('flatD').value) || 0;
        const perc = parseFloat(document.getElementById('percD').value) || 0;

        let subtotal = sparesTotal + labour + lathe;
        let afterFlat = subtotal - flat;
        let discounted = afterFlat - (afterFlat * (perc / 100));
        let final = discounted - prePaid;

        document.getElementById('grandTotal').innerText = Math.round(final);
    }

    async function finalizeJob() {
        // Here you would save the final figures to the job_cards table and close it
        alert("Job Finalized! Values saved to main ledger.");
        window.location.href = 'index.html';
    }

    loadJob();
    setRole('spare'); // Default view
</script>
</body>
</html>
