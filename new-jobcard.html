<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Job Card - My Care</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --light: #f4f7f6; }
        body { font-family: sans-serif; background: var(--light); padding: 15px; margin: 0; }
        .form-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #444; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-save { background: var(--success); color: white; border: none; width: 100%; padding: 16px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; margin-top: 25px; cursor: pointer; }
        .btn-save:disabled { background: #95a5a6; }
    </style>
</head>
<body>
<div class="form-card">
    <a href="index.html" style="text-decoration:none; color:var(--primary);">← Back to Dashboard</a>
    <h2 style="margin-top:10px;">Open Job Card</h2>
    <form id="jcForm">
        <label>Customer Mobile</label>
        <input type="tel" id="mobile" required>
        <label>Vehicle Number</label>
        <input type="text" id="vehNo" required>
        <label>Customer Complaint</label>
        <textarea id="complaint" rows="2" placeholder="What is the problem?"></textarea>
        <label>Estimate Given to Customer (₹)</label>
        <input type="number" id="estimate" value="0">
        <label>Assign Mechanic</label>
        <select id="mechanicSelect" required><option value="">Select Mechanic...</option></select>
        <button type="submit" id="submitBtn" class="btn-save">OPEN JOB CARD</button>
    </form>
</div>
<script>
    const SB_URL = "https://jycoirrphpvxkrwrjcwf.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    async function loadMechs() {
        const { data } = await supabaseClient.from('mechanics').select('id, name').eq('is_active', true);
        const select = document.getElementById('mechanicSelect');
        data?.forEach(m => {
            let opt = document.createElement('option');
            opt.value = m.id; opt.innerHTML = m.name; select.appendChild(opt);
        });
    }

    document.getElementById('jcForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = "SAVING TO CLOUD..."; btn.disabled = true;

        try {
            const mobile = document.getElementById('mobile').value;
            // 1. Save Customer
            await supabaseClient.from('customers').upsert({ mobile_number: mobile });

            // 2. Save Vehicle
            const { data: vData } = await supabaseClient.from('vehicles').upsert({
                customer_mobile: mobile, reg_number: document.getElementById('vehNo').value
            }).select().single();

            // 3. Create Job Card with Complaint & Estimate
            const { error } = await supabaseClient.from('job_cards').insert({
                customer_mobile: mobile,
                vehicle_id: vData.id,
                mech_id: document.getElementById('mechanicSelect').value,
                status: 'Open',
                problem_mentioned: document.getElementById('complaint').value,
                estimate_given: document.getElementById('estimate').value,
                jc_date: new Date().toISOString().split('T')[0]
            });

            if (!error) { window.location.href = 'index.html'; }
            else { throw error; }
        } catch (err) {
            alert("Error: " + err.message);
            btn.innerText = "OPEN JOB CARD"; btn.disabled = false;
        }
    });
    loadMechs();
</script>
</body>
</html>
