<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Care - New Job Card</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --info: #2980b9; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .step { display: none; }
        .active { display: block; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.85rem; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        /* Step 3 Icons */
        .veh-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .veh-rect { border: 2px solid var(--info); padding: 12px; border-radius: 8px; cursor: pointer; background: #f0f7ff; text-align: center; font-weight: bold; font-size: 0.9rem; }
        .veh-rect:hover { background: #d0e7ff; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-search { background: var(--primary); color: white; width: auto; margin: 0; padding: 10px 20px; }
        .btn-success { background: var(--success); color: white; }
        .btn-add { background: none; border: 1px dashed var(--info); color: var(--info); }
        .loading { display:none; text-align: center; color: var(--info); font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="text-decoration:none; font-size: 0.8rem;">← Dashboard</a>
    
    <div id="step1" class="step active">
        <h2>Step 1: Customer Mobile</h2>
        <div style="display:flex; gap:10px;">
            <input type="tel" id="mobile" placeholder="10 Digits">
            <button class="btn btn-search" onclick="searchCustomer()">SEARCH</button>
        </div>
        
        <div id="step2" style="display:none; margin-top:15px; background:#fff9db; padding:15px; border-radius:10px;">
            <h3 style="margin:0 0 10px 0; font-size:1rem;">New Customer Details</h3>
            <label>Name</label><input type="text" id="custName">
            <label>Address</label><input type="text" id="custAddress">
            <button class="btn btn-success" onclick="saveCustomer()">SAVE & NEXT</button>
        </div>
    </div>

    <div id="step3" class="step">
        <h2>Step 3: Select Vehicle</h2>
        <div id="vehicleIcons" class="veh-grid"></div>
        <button class="btn btn-add" onclick="showNewVehForm()">+ Link New Vehicle</button>
        
        <div id="newVehForm" style="display:none; margin-top:15px; background:#f0f0f0; padding:15px; border-radius:10px;">
            <label>Brand</label><input type="text" id="vBrand">
            <label>Vehicle Name</label><input type="text" id="vName">
            <label>Colour</label><input type="text" id="vColor">
            <label>Number</label><input type="text" id="vNumber" placeholder="MP-04-XX-0000">
            <button class="btn btn-success" onclick="linkNewVehicle()">LINK & SELECT</button>
        </div>
    </div>

    <div id="step4" class="step">
        <h2>Step 4: Finalize Job</h2>
        <div id="vehLabel" style="background:#e8f5e9; padding:10px; border-radius:8px; font-weight:bold; color:#2e7d32; margin-bottom:15px;"></div>
        <label>Complaint</label><textarea id="complaint" rows="3"></textarea>
        <label>Estimate (₹)</label><input type="number" id="estimate" value="0">
        <label>Mechanic</label><select id="mechSelect"></select>
        
        <div id="loader" class="loading">SAVING TO CLOUD...</div>
        <button id="finalBtn" class="btn btn-success" onclick="createJobCard()">OPEN JOB CARD</button>
    </div>
</div>

<script>
    const SB_URL = "https://jycoirrphpvxkrwrjcwf.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    let selectedVehicleId = null;

    async function searchCustomer() {
        const phone = document.getElementById('mobile').value;
        const { data: customer } = await supabaseClient.from('customers').select('*').eq('mobile_number', phone).single();
        
        if (customer) {
            document.getElementById('custName').value = customer.name;
            document.getElementById('custAddress').value = customer.address;
            goToStep3(phone);
        } else {
            document.getElementById('step2').style.display = 'block';
        }
    }

    async function saveCustomer() {
        const phone = document.getElementById('mobile').value;
        await supabaseClient.from('customers').upsert({
            mobile_number: phone, name: document.getElementById('custName').value, address: document.getElementById('custAddress').value
        });
        goToStep3(phone);
    }

    async function goToStep3(phone) {
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step3').classList.add('active');
        
        const { data: vehicles } = await supabaseClient.from('vehicles').select('*').eq('customer_mobile', phone);
        const grid = document.getElementById('vehicleIcons');
        grid.innerHTML = '';
        vehicles?.forEach(v => {
            grid.innerHTML += `<div class="veh-rect" onclick="selectVeh('${v.id}', '${v.reg_number}')">${v.reg_number}<br><small>${v.make_model}</small></div>`;
        });
    }

    function showNewVehForm() { document.getElementById('newVehForm').style.display = 'block'; }

    async function linkNewVehicle() {
        const { data, error } = await supabaseClient.from('vehicles').insert({
            customer_mobile: document.getElementById('mobile').value,
            brand: document.getElementById('vBrand').value,
            make_model: document.getElementById('vName').value,
            color: document.getElementById('vColor').value,
            reg_number: document.getElementById('vNumber').value
        }).select().single();
        if(data) selectVeh(data.id, data.reg_number);
        else alert("Vehicle link failed: " + error.message);
    }

    async function selectVeh(id, label) {
        selectedVehicleId = id;
        document.getElementById('vehLabel').innerText = "Vehicle: " + label;
        document.getElementById('step3').classList.remove('active');
        document.getElementById('step4').classList.add('active');
        
        const { data: mechs } = await supabaseClient.from('mechanics').select('id, name').eq('is_active', true);
        const sel = document.getElementById('mechSelect');
        sel.innerHTML = '<option value="">Select Mechanic</option>';
        mechs?.forEach(m => { sel.innerHTML += `<option value="${m.id}">${m.name}</option>`; });
    }

    async function createJobCard() {
        const btn = document.getElementById('finalBtn');
        const loader = document.getElementById('loader');
        btn.style.display = 'none'; loader.style.display = 'block';

        const { error } = await supabaseClient.from('job_cards').insert({
            customer_mobile: document.getElementById('mobile').value,
            vehicle_id: selectedVehicleId,
            mech_id: document.getElementById('mechSelect').value,
            problem_mentioned: document.getElementById('complaint').value,
            estimate_given: document.getElementById('estimate').value,
            status: 'Open'
        });

        if (!error) window.location.href = 'index.html';
        else { alert("Error: " + error.message); btn.style.display = 'block'; loader.style.display = 'none'; }
    }
</script>
</body>
</html>
