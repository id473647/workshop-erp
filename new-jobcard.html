<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Job Card - My Care</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; margin: 0; }
        .form-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { color: #2c3e50; margin-top: 0; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #34495e; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .btn-save { background: #27ae60; color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; margin-top: 25px; cursor: pointer; }
        .btn-back { background: #95a5a6; color: white; text-decoration: none; display: inline-block; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="form-card">
    <a href="index.html" class="btn-back">← Back to Dashboard</a>
    <h2>Create Job Card</h2>
    
    <form id="jcForm">
        <label>Customer Mobile (Primary Key)</label>
        <input type="tel" id="mobile" placeholder="Enter 10 digit number" required>

        <label>Customer Name & Address</label>
        <input type="text" id="custName" placeholder="Full Name">
        <input type="text" id="custAddress" placeholder="Address/Area">

        <label>Vehicle Brand & Name</label>
        <div style="display:flex; gap:10px;">
            <input type="text" id="brand" placeholder="Hero/Honda">
            <input type="text" id="vehName" placeholder="Activa/Shine">
        </div>

        <label>Vehicle Number & Colour</label>
        <div style="display:flex; gap:10px;">
            <input type="text" id="vehNo" placeholder="MP-04-XX-0000">
            <input type="text" id="vehColor" placeholder="Black/Red">
        </div>

        <label>Customer Complaint</label>
        <textarea id="complaint" rows="3" placeholder="Symptoms, noise, service needed..."></textarea>

        <label>Estimate Given (₹)</label>
        <input type="number" id="estimate" placeholder="Approximate cost">

        <label>Assign Mechanic</label>
        <select id="mechanicSelect" required>
            <option value="">Select Mechanic</option>
        </select>

        <button type="submit" class="btn-save">OPEN JOB CARD</button>
    </form>
</div>

<script>
    // These keys connect your app to your specific database
    const SB_URL = "https://jycoirrphpvxkrwrjcwf.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k";
    
    // Create the connection
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    // 1. Auto-fetch Customer Details when Mobile Number is entered
    document.getElementById('mobile').addEventListener('blur', async (e) => {
        const phone = e.target.value;
        if(phone.length < 10) return;

        const { data } = await supabaseClient.from('customers').select('*').eq('mobile_number', phone).single();
        if (data) {
            document.getElementById('custName').value = data.name;
            document.getElementById('custAddress').value = data.address;
        }
    });

    // 2. Load Mechanics into Dropdown
    async function loadMechs() {
        const { data } = await supabaseClient.from('mechanics').select('id, name').eq('is_active', true);
        const select = document.getElementById('mechanicSelect');
        if(data) {
            data.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m.id;
                opt.innerHTML = m.name;
                select.appendChild(opt);
            });
        }
    }

    // 3. Save the Job Card
    document.getElementById('jcForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const mobile = document.getElementById('mobile').value;
        const name = document.getElementById('custName').value;
        const address = document.getElementById('custAddress').value;

        // Step A: Save/Update Customer
        await supabaseClient.from('customers').upsert({ mobile_number: mobile, name: name, address: address });

        // Step B: Save/Update Vehicle
        const { data: vehData } = await supabaseClient.from('vehicles').upsert({
            customer_mobile: mobile,
            reg_number: document.getElementById('vehNo').value,
            make_model: document.getElementById('brand').value + " " + document.getElementById('vehName').value
        }).select().single();

        // Step C: Open the Job Card
        const { error: jcError } = await supabaseClient.from('job_cards').insert({
            customer_mobile: mobile,
            vehicle_id: vehData.id,
            mech_id: document.getElementById('mechanicSelect').value,
            status: 'Open'
        });

        if(!jcError) {
            alert("Job Card " + document.getElementById('vehNo').value + " Opened!");
            window.location.href = 'index.html';
        } else {
            alert("Error: " + jcError.message);
        }
    });

    loadMechs();
</script>
</body>
</html>
