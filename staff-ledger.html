<!DOCTYPE html>
<html>
<head>
    <title>Ledger - My Care</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 0.9rem; }
        th { background: #2c3e50; color: white; }
    </style>
</head>
<body>
    <a href="index.html" style="text-decoration:none;">← Back</a>
    <h2>Staff Balances</h2>
    <div id="ledgerTable">Loading...</div>
<script>
    const SB_URL = "https://jycoirrphpvxkrwrjcwf.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y29pcnJwaHB2eGtyd3JqY3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTQxMTMsImV4cCI6MjA5MzkzMDExM30.mw7rEiJAX9mFRpLMCFifMNVgjXw6JJHA4RlQhR9gL3k";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    async function load() {
        const { data: mechs } = await supabaseClient.from('mechanics').select('*');
        let html = '<table><tr><th>Name</th><th>Earned</th><th>Advances</th><th>Net</th></tr>';
        for (let m of mechs) {
            const { data: led } = await supabaseClient.from('staff_ledger').select('*').eq('mechanic_id', m.id);
            let e = 0, a = 0; led?.forEach(x => x.entry_type === 'EARNING' ? e += parseFloat(x.amount) : a += parseFloat(x.amount));
            html += `<tr><td>${m.name}</td><td style="color:green">₹${e}</td><td style="color:red">₹${a}</td><td><strong>₹${e-a}</strong></td></tr>`;
        }
        document.getElementById('ledgerTable').innerHTML = html + '</table>';
    }
    load();
</script>
</body>
</html>
